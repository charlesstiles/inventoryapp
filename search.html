<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Search</title>
  <link rel="stylesheet" href="./styles.css?v=1" />
  <script src="./config.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./navigation.js?v=1"></script>
</head>
<body>
  <header>
    <h1>Inventory Search</h1>
    <div id="navBar"></div>
  </header>

  <div class="card">
    <label for="q">Search items</label>
    <input id="q" type="text" placeholder="e.g. hammer" />
    <button id="btnSearch" class="btn">Search</button>
    <div id="msg" class="error hidden"></div>

    <table class="table" id="tbl">
      <thead>
        <tr>
          <th>Description</th>
          <th>Container</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
(() => {
  const cfg = window.APP_CONFIG || {};
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  window.APP_SUPABASE = sb;

  const qEl = document.getElementById("q");
  const btn = document.getElementById("btnSearch");
  const msg = document.getElementById("msg");
  const tbody = document.querySelector("#tbl tbody");

  function show(el, text) { el.textContent = text || ""; el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); el.textContent = ""; }

  async function requireAuthOrRedirect() {
    const { data } = await sb.auth.getSession();
    if (!data?.session) {
      location.href = "./capture.html?v=" + Date.now();
      return false;
    }
    return true;
  }

  async function boot() {
    const ok = await requireAuthOrRedirect();
    if (!ok) return;
    if (window.APP_NAV?.render) await window.APP_NAV.render("navBar");
  }

  boot();

  async function doSearch() {
    hide(msg);
    tbody.innerHTML = "";

    const ok = await requireAuthOrRedirect();
    if (!ok) return;

    const q = (qEl.value || "").trim();
    if (!q) return show(msg, "Enter a search term.");

    btn.disabled = true;
    try {
      // wildcard before/after
      const like = `%${q}%`;
      const { data, error } = await sb
        .from("items")
        .select("description, container_code, created_at")
        .ilike("description", like)
        .order("created_at", { ascending: false })
        .limit(200);

      if (error) throw error;

      for (const r of (data || [])) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(r.description || "")}</td>
          <td>${escapeHtml(r.container_code || "")}</td>
          <td>${formatDt(r.created_at)}</td>
        `;
        tbody.appendChild(tr);
      }
    } catch (e) {
      show(msg, (e && e.message) ? e.message : String(e));
    } finally {
      btn.disabled = false;
    }
  }

  function formatDt(v) {
    if (!v) return "";
    const d = new Date(v);
    return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  btn.addEventListener("click", doSearch);
  qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
})();
</script>
</body>
</html>
