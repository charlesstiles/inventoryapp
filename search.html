<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Search</title>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared config (add config.js at repo root) -->
  <script src="./config.js"></script>

    <!-- Shared navigation (add navigation.js at repo root) -->
  <script src="./navigation.js"></script>

  <style>
    /* --- Navigation (responsive) --- */
#navBar { display: flex; justify-content: flex-end; }

.navWrap { position: relative; display: flex; align-items: center; gap: 10px; }

/* Desktop inline links */
.navInline { display: flex; gap: 10px; align-items: center; }

/* Hamburger button (mobile) */
.navBurger {
  display: none;            /* hidden on desktop */
  width: auto;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #1e3a8a;
  background: #fff;
  color: #1e3a8a;
  font-weight: 900;
  cursor: pointer;
}

/* Links (small, consistent) */
.navLink {
  display: inline-block;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #1e3a8a;
  background: #fff;
  color: #1e3a8a;
  text-decoration: none;
  font-weight: 900;
  font-size: 14px;
  line-height: 1;
}

.navLink.active {
  background: #1e3a8a;
  color: #fff;
}

/* Dropdown menu (mobile) */
.navMenu {
  position: absolute;
  top: 44px;
  right: 0;
  min-width: 160px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 10px 20px rgba(15,23,42,0.18);
  padding: 8px;
  display: grid;
  gap: 8px;
  z-index: 2000;
}

/* Utility */
.hidden { display: none !important; }

/* Responsive breakpoint */
@media (max-width: 520px) {
  .navInline { display: none; }   /* hide inline on mobile */
  .navBurger { display: inline-block; } /* show hamburger */
  .navLink { width: 100%; }       /* menu links fill */
}

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 { font-size: 20px; margin: 0; }

    a.link-btn {
      display: inline-block;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e3a8a;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 800;
      background: #fff;
      text-align: center;
      white-space: nowrap;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.06);
    }

    label {
      display: block;
      margin-top: 10px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30,58,138,0.15);
      outline: none;
    }

    button {
      background: #1e3a8a;
      color: #fff;
      font-weight: 800;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
      font-weight: 800;
    }

    tr:hover { background: #f8fafc; }

    .muted { color: #64748b; font-size: 12px; }

    .error, .info {
      padding: 10px;
      margin-top: 12px;
      border-radius: 10px;
      font-weight: 800;
      text-align: center;
      color: #fff;
    }
    .error { background: #dc2626; }
    .info { background: #0ea5e9; }
  </style>
</head>

<body>
  <header>
    <h1>Inventory Search</h1>
    <div id="navBar"></div>
  </header>

  <div class="card">
    <label for="searchInput">Search items</label>
    <input id="searchInput" placeholder="Search by description or container code" />

    <button id="searchBtn" type="button">Search</button>

    <div id="searchMsg"></div>

    <table id="resultsTable" style="display:none;">
      <thead>
        <tr>
          <th>Item Description</th>
          <th>Container</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Missing config.js or SUPABASE settings. Ensure config.js exists and is loaded.");
        return;
      }
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;

      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");
      const searchMsg = document.getElementById("searchMsg");
      const resultsTable = document.getElementById("resultsTable");
      const tbody = resultsTable.querySelector("tbody");

      window.APP_NAV.render("navBar");

      function showError(msg) { searchMsg.innerHTML = `<div class="error">${msg}</div>`; }
      function showInfo(msg) { searchMsg.innerHTML = `<div class="info">${msg}</div>`; }
      function clearResults() {
        tbody.innerHTML = "";
        resultsTable.style.display = "none";
      }

      async function runSearch() {
        searchBtn.disabled = true;
        searchMsg.innerHTML = "";
        clearResults();

        const term = searchInput.value.trim();
        if (!term) {
          showError("Enter a search term.");
          searchBtn.disabled = false;
          return;
        }

        try {
          const { data, error } = await sb
            .from("items")
            .select("item_description, container_code, created_at")
            .or(`item_description.ilike.%${term}%,container_code.ilike.%${term}%`)
            .order("created_at", { ascending: false })
            .limit(100);

          if (error) {
            showError(error.message);
            return;
          }

          if (!data || data.length === 0) {
            showInfo("No results found.");
            return;
          }

          for (const row of data) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.item_description}</td>
              <td>${row.container_code}</td>
              <td class="muted">${new Date(row.created_at).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          }

          resultsTable.style.display = "table";
        } catch (e) {
          showError(e.message || String(e));
        } finally {
          searchBtn.disabled = false;
        }
      }

      searchBtn.addEventListener("click", runSearch);
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") runSearch();
      });
    });
  </script>
</body>
</html>
