<!--
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Search</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
</head>
<body>
  <div class="page">
    <div id="navBar"></div>
    <div id="banner" class="banner" style="display:none;"></div>
    <div class="card">
      <h1>Search</h1>
      <div class="small-note" id="indexStatus" style="margin-bottom:12px;"></div>
      <label>Search (description or container)</label>
      <div class="row">
        <input id="q" type="text" placeholder="e.g. hammer or TOTE0076" />
        <button class="btn secondary" id="btnGo" style="max-width:160px;">Search</button>
        <button class="btn secondary" id="btnRefreshIndex" style="max-width:220px;">Refresh Offline Index</button>
      </div>
      <table class="table" id="tbl" style="display:none;">
        <thead>
          <tr><th></th><th>Description</th><th>Container</th><th>User</th><th>Created</th><th>Source</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="small-note" id="note"></div>
    </div>
  </div>
<script>
(function(){
  const banner = document.getElementById("banner");
  const qEl = document.getElementById("q");
  const btnGo = document.getElementById("btnGo");
  const btnRefreshIndex = document.getElementById("btnRefreshIndex");
  const tbl = document.getElementById("tbl");
  const tbody = document.getElementById("tbody");
  const note = document.getElementById("note");
  const indexStatus = document.getElementById("indexStatus");
  const sb = getSupabase();
  const DB_NAME = "inventoryapp_offline_v1";
  const DB_VERSION = 1;
  const STORE_INDEX = "search_index";
  const STORE_META = "meta";
  let cachedUser = null;
  function showBanner(type, msg){ banner.className = "banner " + (type || "ok"); banner.textContent = msg; banner.style.display = "block"; setTimeout(() => banner.style.display = "none", 4500); }
  function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  async function openDb(){ return await new Promise((resolve, reject) => { const req = indexedDB.open(DB_NAME, DB_VERSION); req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE_INDEX)) db.createObjectStore(STORE_INDEX, { keyPath: "ref_uid" }); if (!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META, { keyPath: "key" }); }; req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
  async function idbPut(store, value){ const db = await openDb(); return await new Promise((resolve, reject) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).put(value); tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); }); }
  async function idbGetAll(store){ const db = await openDb(); return await new Promise((resolve, reject) => { const tx = db.transaction(store, "readonly"); const req = tx.objectStore(store).getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error); }); }
  async function idbClear(store){ const db = await openDb(); return await new Promise((resolve, reject) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).clear(); tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); }); }
  async function setMeta(key, value){ return idbPut(STORE_META, { key, value }); }
  async function getMeta(key){ const db = await openDb(); return await new Promise((resolve, reject) => { const tx = db.transaction(STORE_META, "readonly"); const req = tx.objectStore(STORE_META).get(key); req.onsuccess = () => resolve(req.result?.value ?? null); req.onerror = () => reject(req.error); }); }
  async function renderNavSafe(timeoutMs = 1200){ try{ if (!window.APP_NAV || typeof window.APP_NAV.render !== "function") return; await Promise.race([window.APP_NAV.render("navBar"), new Promise((res) => setTimeout(res, timeoutMs))]); }catch(e){ console.warn("Nav render failed", e); } }
  async function requireAuth(){ await renderNavSafe(); if (!navigator.onLine) return null; const { data } = await sb.auth.getUser(); cachedUser = data?.user || null; return cachedUser; }
  async function signedThumb(path){ if (!path || !navigator.onLine || !cachedUser) return null; const { data, error } = await sb.storage.from("item-photos").createSignedUrl(path, 60 * 30); if (error) return null; return data?.signedUrl || null; }
  async function upsertIndexItems(items, source="live"){ for (const it of items){ await idbPut(STORE_INDEX, { ref_uid: it.ref_uid, item_id: it.item_id, container_code: it.container_code, item_description: it.item_description || "", created_by: it.created_by || "", created_at: it.created_at || new Date().toISOString(), photo_path: it.photo_path || null, is_active: it.is_active !== false, source }); } }
  async function updateIndexStatus(extra=""){ const lastSync = await getMeta("search_index_refreshed_at"); const all = await idbGetAll(STORE_INDEX); const parts = [navigator.onLine ? "Online" : "Offline", `${all.length} cached item(s)`]; if (lastSync) parts.push(`Index refreshed: ${new Date(lastSync).toLocaleString()}`); if (extra) parts.push(extra); indexStatus.textContent = parts.join(" • "); }
  async function refreshOfflineIndex(){ const user = await requireAuth(); if (!navigator.onLine || !user) { await updateIndexStatus("Offline index refresh requires a live signed-in session."); return; } btnRefreshIndex.disabled = true; note.textContent = "Refreshing offline index…"; try{ await idbClear(STORE_INDEX); let from = 0; const pageSize = 1000; let total = 0; while (true) { const { data, error } = await sb.from("items").select("item_id, ref_uid, container_code, item_description, created_by, created_at, photo_path, is_active").eq("is_active", true).order("created_at", { ascending: false }).range(from, from + pageSize - 1); if (error) throw error; if (!data?.length) break; await upsertIndexItems(data, "live"); total += data.length; if (data.length < pageSize) break; from += pageSize; } await setMeta("search_index_refreshed_at", new Date().toISOString()); note.textContent = `Offline index refreshed: ${total} item(s).`; showBanner("ok", "Offline index refreshed ✅"); }catch(e){ note.textContent = ""; showBanner("err", "Index refresh failed: " + (e.message || e)); }finally{ btnRefreshIndex.disabled = false; await updateIndexStatus(); } }
  async function renderResults(items, sourceLabel){ tbody.innerHTML = ""; if (!items?.length) { tbl.style.display = "none"; note.textContent = "No results."; return; } tbl.style.display = "table"; note.textContent = `${items.length} result(s) from ${sourceLabel}.`; for (const it of items){ const tr = document.createElement("tr"); tr.style.cursor = "pointer"; tr.addEventListener("click", () => { if (String(it.ref_uid || "").startsWith("local-")) return; window.location.href = `item_detail.html?ref_uid=${encodeURIComponent(it.ref_uid)}`; }); const thumbUrl = await signedThumb(it.photo_path); tr.innerHTML = `<td>${thumbUrl ? `<img class="thumb" src="${thumbUrl}" />` : ""}</td><td>${esc(it.item_description)}</td><td class="mono"><a href="#" data-kind="container">${esc(it.container_code)}</a></td><td class="mono">${esc(it.created_by || "")}</td><td class="mono">${esc(new Date(it.created_at).toLocaleString())}</td><td class="mono">${esc(it.source || sourceLabel)}</td>`; tr.querySelectorAll('a[data-kind="container"]').forEach(a => { a.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); if (String(it.ref_uid || "").startsWith("local-")) return; window.location.href = `container_detail.html?container_code=${encodeURIComponent(it.container_code)}`; }); }); tbody.appendChild(tr); } }
  async function runSearch(){ const q = qEl.value.trim().toLowerCase(); if (!q){ showBanner("warn","Enter a search term."); return; } note.textContent = navigator.onLine ? "Searching…" : "Searching offline index…"; tbody.innerHTML = ""; tbl.style.display = "none"; try{ const user = await requireAuth(); if (navigator.onLine && user) { const like = `%${q}%`; const { data: items, error } = await sb.from("items").select("item_id, ref_uid, container_code, item_description, created_by, created_at, photo_path, is_active").eq("is_active", true).or(`item_description.ilike.${like},container_code.ilike.${like}`).order("created_at", { ascending:false }).limit(200); if (error) throw error; await upsertIndexItems(items || [], "live"); await renderResults(items || [], "live"); await updateIndexStatus(); return; } const all = await idbGetAll(STORE_INDEX); const filtered = all.filter(it => it && it.is_active !== false).filter(it => String(it.item_description || "").toLowerCase().includes(q) || String(it.container_code || "").toLowerCase().includes(q)).sort((a,b) => String(b.created_at || "").localeCompare(String(a.created_at || ""))).slice(0, 200); await renderResults(filtered, "offline cache"); await updateIndexStatus(filtered.length ? "Offline results in use." : "No offline match."); }catch(e){ showBanner("err","Search error: " + (e.message || e)); note.textContent = ""; } }
  btnGo.addEventListener("click", runSearch);
  btnRefreshIndex.addEventListener("click", refreshOfflineIndex);
  qEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") runSearch(); });
  window.addEventListener("online", () => updateIndexStatus().catch(console.warn));
  window.addEventListener("offline", () => updateIndexStatus("Offline cache available.").catch(console.warn));
  requireAuth().then(() => updateIndexStatus()).then(() => { if (navigator.onLine) refreshOfflineIndex().catch(console.warn); });
})();
</script>
</body>
</html>
