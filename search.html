<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Search</title>

  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./navigation.js"></script>
</head>

<body>
  <header>
    <h1>Inventory Search</h1>
    <div id="navBar"></div>
  </header>

  <div class="card">
    <label for="searchInput">Search items</label>
    <input id="searchInput" placeholder="Search by description or container code" />

    <button id="searchBtn" type="button" class="btn">Search</button>

    <div id="searchMsg"></div>

    <table id="resultsTable" class="table hidden">
      <thead>
        <tr>
          <th>Description</th>
          <th>Container</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.APP_NAV) window.APP_NAV.render("navBar");

      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Missing config.js settings.");
        return;
      }
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");
      const searchMsg = document.getElementById("searchMsg");
      const resultsTable = document.getElementById("resultsTable");
      const tbody = resultsTable.querySelector("tbody");

      function show(type, text) {
        searchMsg.innerHTML = `<div class="${type}">${String(text)}</div>`;
      }

      function clearResults() {
        tbody.innerHTML = "";
        resultsTable.classList.add("hidden");
      }

      async function runSearch() {
        searchBtn.disabled = true;
        searchMsg.innerHTML = "";
        clearResults();

        const term = searchInput.value.trim();
        if (!term) { show("error", "Enter a search term."); searchBtn.disabled = false; return; }

        try {
          const { data, error } = await sb
            .from("items")
            .select("item_description, container_code, created_at")
            .or(`item_description.ilike.%${term}%,container_code.ilike.%${term}%`)
            .order("created_at", { ascending: false })
            .limit(200);

          if (error) { show("error", error.message); return; }
          if (!data || data.length === 0) { show("info", "No results found."); return; }

          for (const row of data) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.item_description || ""}</td>
              <td>${row.container_code || ""}</td>
              <td class="muted">${new Date(row.created_at).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          }
          resultsTable.classList.remove("hidden");
        } catch (e) {
          show("error", e?.message || String(e));
        } finally {
          searchBtn.disabled = false;
        }
      }

      searchBtn.addEventListener("click", runSearch);
      searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
    });
  </script>
</body>
</html>
