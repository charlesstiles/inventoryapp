<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inventory Search</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:system-ui;background:#f6f6f6;margin:0;padding:20px}
.card{background:white;padding:20px;border-radius:8px;max-width:900px;margin:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<div class="card">

<h2>Search Inventory</h2>

<input id="q" placeholder="Search description or container"/>
<button id="go">Search</button>

<table id="tbl" style="display:none">
<thead>
<tr>
<th>Description</th>
<th>Container</th>
<th>Date</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

const sb=getSupabase()

async function runSearch(){

const q=document.getElementById("q").value.trim()

if(!q) return

const like="%"+q+"%"

const {data,error}=await sb
.from("items")
.select("item_description,container_code,created_at")
.or(`item_description.ilike.${like},container_code.ilike.${like}`)
.limit(200)

if(error){
alert(error.message)
return
}

const tbody=document.getElementById("tbody")
tbody.innerHTML=""

data.forEach(r=>{
const tr=document.createElement("tr")
tr.innerHTML=`
<td>${r.item_description||""}</td>
<td>${r.container_code}</td>
<td>${new Date(r.created_at).toLocaleString()}</td>
`
tbody.appendChild(tr)
})

document.getElementById("tbl").style.display="table"

}

document.getElementById("go").addEventListener("click",runSearch)

</script>

</body>
</html>
