<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Location Detail</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
  <style>
    .picker-grid{
      display:grid;
      grid-template-columns:1fr 180px;
      gap:10px;
      align-items:end;
    }
    .detail-meta{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:10px;
      margin-bottom:12px;
    }
    .meta-chip{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:10px 12px;
    }
    .photo-box{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      padding:12px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    .photo-box .thumb{
      width:96px;height:96px;
    }
    @media (max-width:700px){
      .picker-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="navBar"></div>
    <div id="banner" class="banner warn" style="display:none;"></div>

    <div class="card" id="pickerCard" style="display:none;">
      <h1>Select a Location</h1>
      <label>Locations</label>
      <div class="picker-grid">
        <select id="locationPicker"></select>
        <button class="btn secondary" id="btnOpen" style="max-width:180px;">Open</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn" id="btnAdd" style="max-width:220px;">Add Location</button>
      </div>
      <div class="small-note">Tip: you can also open directly with ?location_code=... or ?location_id=...</div>
    </div>

    <div class="card" id="detailCard" style="display:none;">
      <h1>Location Detail</h1>

      <div id="meta" class="detail-meta"></div>

      <div class="row">
        <div>
          <label>Location Code</label>
          <input id="locationCode" type="text" placeholder="e.g. Serenity_Utility_Trailer" disabled />
          <div class="small-note">Reference</div>
        </div>
        <div>
          <label>Location ID</label>
          <input id="locationId" type="text" placeholder="uuid" disabled />
          <div class="small-note">Reference</div>
        </div>
      </div>

      <label>Description</label>
      <textarea id="locationDescription" placeholder="Location description" disabled></textarea>

      <div class="hr"></div>

      <label>Photo</label>
      <div class="photo-box">
        <img id="photoPreview" class="thumb" alt="Location photo" />
        <div>
          <input id="photoFile" type="file" accept="image/*" disabled />
          <div class="small-note">We’ll wire editing after permissions + history rules are finalized.</div>
        </div>
      </div>

      <div class="hr"></div>

      <div class="row">
        <button id="editBtn" class="btn secondary" disabled style="max-width:180px;">Edit (next)</button>
        <button id="saveBtn" class="btn" disabled style="max-width:180px;">Save (next)</button>
      </div>
    </div>
  </div>

  <script>
    const banner = document.getElementById("banner");
    const pickerCard = document.getElementById("pickerCard");
    const detailCard = document.getElementById("detailCard");
    const locationPicker = document.getElementById("locationPicker");
    const btnOpen = document.getElementById("btnOpen");
    const btnAdd = document.getElementById("btnAdd");
    const locationCodeEl = document.getElementById("locationCode");
    const locationIdEl = document.getElementById("locationId");
    const locationDescEl = document.getElementById("locationDescription");
    const photoPreview = document.getElementById("photoPreview");

    function setBanner(type, msg) {
      banner.className = "banner " + (type || "warn");
      banner.textContent = msg;
      banner.style.display = "block";
    }
    function clearBanner() { banner.style.display = "none"; }
    function getQS(name) {
      const u = new URL(window.location.href);
      return u.searchParams.get(name);
    }
    function setQS(params) {
      const u = new URL(window.location.href);
      Object.entries(params).forEach(([k,v]) => {
        if (v === null || v === undefined || v === "") u.searchParams.delete(k);
        else u.searchParams.set(k, v);
      });
      window.location.href = u.toString();
    }

    async function requireLogin() {
      await window.APP_NAV.render("navBar");
      const sb = window.getSupabase();
      const { data } = await sb.auth.getUser();
      if (!data?.user) {
        window.location.href = "index.html";
        return null;
      }
      return data.user;
    }

    function renderMeta(row){
      const meta = document.getElementById("meta");
      meta.innerHTML = `
        <div class="meta-chip mono"><strong>location_code</strong><br>${row.location_code || ""}</div>
        <div class="meta-chip mono"><strong>location_id</strong><br>${row.location_id || ""}</div>
        ${row.created_at ? `<div class="meta-chip mono"><strong>created</strong><br>${new Date(row.created_at).toLocaleString()}</div>` : ""}
      `;
    }

    async function showPicker() {
      clearBanner();
      pickerCard.style.display = "block";
      detailCard.style.display = "none";

      const sb = window.getSupabase();
      const { data, error } = await sb
        .from("locations")
        .select("location_code")
        .order("location_code", { ascending: true });

      if (error) {
        setBanner("err", "Failed to load locations: " + error.message);
        return;
      }

      locationPicker.innerHTML = "";
      (data || []).forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.location_code;
        opt.textContent = r.location_code;
        locationPicker.appendChild(opt);
      });

      if ((data || []).length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "(no locations found)";
        locationPicker.appendChild(opt);
        btnOpen.disabled = true;
      } else {
        btnOpen.disabled = false;
      }
    }

    async function loadLocationByParams() {
      const sb = window.getSupabase();
      const isNew = getQS("new") === "1";
      const location_id = getQS("location_id");
      const location_code = getQS("location_code");

      if (isNew) {
        await showPicker();
        setBanner("warn", "Create flow not wired yet. Select a location, or we’ll implement Add Location next.");
        return;
      }

      if (!location_id && !location_code) {
        await showPicker();
        return;
      }

      pickerCard.style.display = "none";
      detailCard.style.display = "block";
      clearBanner();

      let q = sb.from("locations").select("*").limit(1);
      if (location_id) q = q.eq("location_id", location_id);
      else q = q.eq("location_code", location_code);

      const { data, error } = await q;
      if (error) {
        setBanner("err", "Load failed: " + error.message);
        return;
      }
      const row = data && data[0];
      if (!row) {
        setBanner("warn", "Location not found.");
        return;
      }

      renderMeta(row);
      locationCodeEl.value = row.location_code || "";
      locationIdEl.value = row.location_id || "";
      locationDescEl.value = row.location_description || "";

      if (row.photo_path) {
        try {
          const { data: signed, error: sErr } = await sb.storage
            .from("location-photos")
            .createSignedUrl(row.photo_path, 60 * 10);

          if (!sErr && signed?.signedUrl) photoPreview.src = signed.signedUrl;
          else photoPreview.removeAttribute("src");
        } catch (e) {
          photoPreview.removeAttribute("src");
        }
      } else {
        photoPreview.removeAttribute("src");
      }
    }

    btnOpen?.addEventListener("click", () => {
      const code = locationPicker.value;
      if (!code) return;
      setQS({ location_code: code, location_id: null, new: null });
    });

    btnAdd?.addEventListener("click", () => {
      setQS({ new: "1", location_code: null, location_id: null });
    });

    (async function boot(){
      const user = await requireLogin();
      if (!user) return;
      await loadLocationByParams();
    })();
  </script>
</body>
</html>
