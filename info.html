<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Record Info</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="card">
      <h1 id="title">Record Info</h1>
      <div class="small-note">
        Operational details are shown here instead of on the main workflow pages.
      </div>
      <div class="hr"></div>
      <pre id="out" style="white-space:pre-wrap; word-break:break-word; margin:0;"></pre>
    </div>
  </div>

  <script>
    (function() {
      const u = new URL(window.location.href);
      const titleElement = document.getElementById("title");
      const outputElement = document.getElementById("out");

      // Set Title
      titleElement.textContent = u.searchParams.get("title") || "Record Info";

      // Parse and Display Data
      try {
        const rawData = u.searchParams.get("data") || "{}";
        const obj = JSON.parse(decodeURIComponent(rawData));
        outputElement.textContent = JSON.stringify(obj, null, 2);
      } catch (e) {
        outputElement.textContent = "Unable to parse info payload.";
      }
    })();
  </script>
</body>
</html>
