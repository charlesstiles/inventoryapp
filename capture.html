<!--
Update: Fix mobile RLS "new row violates row-level security policy for table containers" by using a SINGLE Supabase client instance per page load.
Why: On iOS/mobile, repeatedly calling getSupabase() can create multiple clients; some requests may execute without an access token and be treated as anon, triggering RLS failures.
Changes:
  1) Create one Supabase client (sb) once and reuse it everywhere.
  2) Add visible Auth Status indicator.
  3) Wait briefly for session restore on mobile; disable Save until authenticated.
  4) Add stronger guards before container/item inserts to ensure a session exists.
Revision: 2026-01-09.v3
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Capture</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
</head>
<body>
  <div class="page">
    <div id="navBar"></div>

    <div id="banner" class="banner" style="display:none;"></div>

    <div class="card">
      <h1>Inventory Capture</h1>

      <!-- AUTH STATUS (mobile-friendly visibility) -->
      <div id="authStatus" style="font:12px/1.3 system-ui; padding:6px 10px; background:#fff3cd; border:1px solid #ffeeba; border-radius:6px; margin:8px 0;">
        Auth: checking...
      </div>

      <!-- LOGIN -->
      <div id="loginBox" style="display:none;">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" />
        <div class="hr"></div>
        <button class="btn" id="btnLogin">Sign In</button>
        <div class="small-note">Sign-in is required before capture/search/container access.</div>
      </div>

      <!-- CAPTURE -->
      <div id="captureBox" style="display:none;">
        <label>Container Code</label>
        <div class="row">
          <input id="containerCode" type="text" placeholder="e.g. TOTE0076" />
          <button class="btn secondary" id="btnScanContainer" style="max-width:180px;">Scan</button>
        </div>
        <div class="small-note" id="containerSetNote"></div>

        <label>Photo (required)</label>
        <input id="photo" type="file" accept="image/*" capture="environment" />

        <label>Description</label>
        <textarea id="desc" placeholder="Item description"></textarea>

        <div class="row">
          <div>
            <label>Quantity</label>
            <input id="qty" type="number" step="0.1" value="1" />
          </div>
          <div></div>
        </div>

        <div class="hr"></div>
        <button class="btn" id="btnSave">Save Item</button>
        <div class="small-note">After save, the form stays ready for the next item in the same container.</div>
      </div>
    </div>
  </div>

  <!-- Scan Modal -->
  <div class="modalBackdrop" id="scanModal">
    <div class="modal">
      <div class="modalHeader">
        <h3>Scan Code 39 Container Label</h3>
        <button class="btn secondary" id="btnCloseScan" style="width:auto;">Close</button>
      </div>
      <div class="modalBody">
        <div class="videoBox">
          <div class="scanHint"></div>
          <div id="scanner"></div>
        </div>
        <div class="small-note">Tip: hold steady ~8–14 inches away. Align the barcode within the box.</div>
      </div>
    </div>
  </div>

<script>
(function(){
  const banner = document.getElementById("banner");
  const loginBox = document.getElementById("loginBox");
  const captureBox = document.getElementById("captureBox");
  const authStatusEl = document.getElementById("authStatus");

  const btnLogin = document.getElementById("btnLogin");
  const btnSave = document.getElementById("btnSave");
  const btnScanContainer = document.getElementById("btnScanContainer");
  const btnCloseScan = document.getElementById("btnCloseScan");
  const scanModal = document.getElementById("scanModal");
  const containerCodeEl = document.getElementById("containerCode");
  const containerSetNote = document.getElementById("containerSetNote");

  // ✅ IMPORTANT: Create ONE Supabase client instance for this page load.
  // If getSupabase() creates a new client each call, using it multiple times can cause
  // authenticated checks to pass but inserts to run as anon (RLS failure).
  const sb = getSupabase();

  function setAuthStatus(msg){
    if (authStatusEl) authStatusEl.textContent = msg;
  }

  function setSaveEnabled(enabled){
    btnSave.disabled = !enabled;
    btnSave.style.opacity = enabled ? "1" : "0.6";
    btnSave.style.pointerEvents = enabled ? "auto" : "none";
  }

  function showBanner(type, msg){
    banner.className = "banner " + (type || "ok");
    banner.textContent = msg;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 4500);
  }

  function code39FullAsciiNormalize(raw){
    if (!raw) return raw;
    let out = "";
    for (let i=0; i<raw.length; i++){
      const ch = raw[i];
      if (ch === "+" && i+1 < raw.length){
        const next = raw[i+1];
        if (next >= "A" && next <= "Z"){
          out += next.toLowerCase();
          i++;
          continue;
        }
      }
      out += ch;
    }
    return out;
  }

  async function waitForSession(maxMs = 2500){
    const start = Date.now();
    while (Date.now() - start < maxMs){
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) return session;
      await new Promise(r => setTimeout(r, 150));
    }
    return null;
  }

  async function requireAuth(){
    await window.APP_NAV.render("navBar");

    setSaveEnabled(false);
    setAuthStatus("Auth: checking session...");

    // Wait briefly for mobile session restore
    const session = await waitForSession(2500);

    if (session?.user){
      setAuthStatus("Auth: OK");
      setSaveEnabled(true);
      return session.user;
    }

    // Fallback check
    const { data, error } = await sb.auth.getUser();
    if (!error && data?.user){
      setAuthStatus("Auth: OK");
      setSaveEnabled(true);
      return data.user;
    }

    setAuthStatus("Auth: NOT logged in. Please sign in.");
    return null;
  }

  async function init(){
    const user = await requireAuth();
    if (!user){
      loginBox.style.display = "block";
      captureBox.style.display = "none";
      return;
    }
    loginBox.style.display = "none";
    captureBox.style.display = "block";
  }

  btnLogin.addEventListener("click", async () => {
    try{
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      setAuthStatus("Auth: signing in...");
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;

      showBanner("ok", "Login successful ✅");
      await init();
    }catch(e){
      setAuthStatus("Auth: NOT logged in. Please sign in.");
      showBanner("err", "Login failed: " + (e.message || e));
      setSaveEnabled(false);
    }
  });





  
  const { data: roleCheck, error: roleErr } = await sb.rpc('auth_role_check');
console.log("DB role seen by Postgres:", roleCheck);







  
  async function ensureActiveContainer(container_code){
    // Active-only lookup
    let { data: existing, error } = await sb
      .from("containers")
      .select("container_id, ref_uid, container_code, is_active")
      .eq("container_code", container_code)
      .eq("is_active", true)
      .maybeSingle();

    if (error) throw error;
    if (existing) return existing;

    // Guard: confirm session exists right before insert
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user){
      throw new Error("Not logged in (session missing). Please sign in again.");
    }

    // Create
    let { data: created, error: insErr } = await sb
      .from("containers")
      .insert([{ container_code }])
      .select("container_id, ref_uid, container_code, is_active")
      .single();

    if (insErr) throw insErr;

    // If trigger not present and ref_uid not set, backfill
    if (!created.ref_uid){
      const { data: upd, error: updErr } = await sb
        .from("containers")
        .update({ ref_uid: created.container_id })
        .eq("container_id", created.container_id)
        .select("container_id, ref_uid, container_code, is_active")
        .single();
      if (updErr) throw updErr;
      created = upd;
    }

    // Redirect immediately to container_detail for enrichment, then return to capture
    const returnUrl = encodeURIComponent("capture.html");
    window.location.href = `container_detail.html?ref_uid=${encodeURIComponent(created.ref_uid)}&return=${returnUrl}`;
    return created;
  }

  async function compressImageToJpeg(file, maxDim=1024, quality=0.72){
    const img = new Image();
    const url = URL.createObjectURL(file);
    await new Promise((res, rej) => { img.onload=res; img.onerror=rej; img.src=url; });

    const w = img.width, h = img.height;
    const scale = Math.min(1, maxDim / Math.max(w,h));
    const nw = Math.round(w*scale);
    const nh = Math.round(h*scale);

    const canvas = document.createElement("canvas");
    canvas.width = nw;
    canvas.height = nh;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, nw, nh);

    const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", quality));
    URL.revokeObjectURL(url);
    return blob;
  }

  btnSave.addEventListener("click", async () => {
    try{
      const user = await requireAuth();
      if (!user) { showBanner("err","Please sign in."); return; }

      const container_code = containerCodeEl.value.trim();
      if (!container_code) { showBanner("err","Container Code is required."); return; }

      const photoFile = document.getElementById("photo").files?.[0];
      if (!photoFile) { showBanner("err","Photo is required."); return; }

      const item_description = document.getElementById("desc").value.trim();
      const quantity = Number(document.getElementById("qty").value || 1);

      setAuthStatus("Auth: OK (saving...)");

      // Ensure container exists (may redirect if newly created)
      await ensureActiveContainer(container_code);

      // Guard again: session must exist for item insert too
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user){
        throw new Error("Not logged in (session missing). Please sign in again.");
      }

      // Insert item row
      let { data: item, error: insErr } = await sb
        .from("items")
        .insert([{
          container_code,
          item_description,
          quantity
        }])
        .select("item_id, ref_uid, container_code, item_description, quantity, is_active")
        .single();

      if (insErr) throw insErr;

      // Backfill ref_uid if needed
      if (!item.ref_uid){
        const { data: updItem, error: updErr } = await sb
          .from("items")
          .update({ ref_uid: item.item_id })
          .eq("item_id", item.item_id)
          .select("item_id, ref_uid, container_code, item_description, quantity, is_active")
          .single();
        if (updErr) throw updErr;
        item = updItem;
      }

      // Upload photo to item-photos bucket
      const jpegBlob = await compressImageToJpeg(photoFile, 1024, 0.72);
      const path = `items/${item.ref_uid}/${item.item_id}.jpg`;

      const { error: upErr } = await sb.storage
        .from("item-photos")
        .upload(path, jpegBlob, { contentType: "image/jpeg", upsert: true });

      if (upErr) throw upErr;

      // Save path on item row
      const { error: savePathErr } = await sb
        .from("items")
        .update({ photo_path: path })
        .eq("item_id", item.item_id);

      if (savePathErr) throw savePathErr;

      showBanner("ok", "Saved ✅");
      setAuthStatus("Auth: OK");

      document.getElementById("photo").value = "";
      document.getElementById("desc").value = "";
      document.getElementById("qty").value = "1";
    }catch(e){
      setAuthStatus("Auth: error (see banner)");
      showBanner("err", "Save failed: " + (e.message || e));
    }
  });

  // ------- Scanner (Quagga) -------
  function openScan(){
    scanModal.style.display = "flex";
    const target = document.getElementById("scanner");
    target.innerHTML = "";

    Quagga.init({
      inputStream: {
        type: "LiveStream",
        target: target,
        constraints: {
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        area: {
          top: "20%",
          right: "10%",
          left: "10%",
          bottom: "20%"
        }
      },
      decoder: { readers: ["code_39_reader"] },
      locate: true
    }, (err) => {
      if (err) {
        showBanner("err", "Scanner init failed: " + (err.message || err));
        closeScan();
        return;
      }
      Quagga.start();
    });

    Quagga.offDetected();
    Quagga.onDetected((res) => {
      const raw = res?.codeResult?.code;
      if (!raw) return;
      const normalized = code39FullAsciiNormalize(raw);

      containerCodeEl.value = normalized;
      containerSetNote.textContent = `Container set: ${normalized}`;
      showBanner("ok", `Scanned: ${normalized}`);

      closeScan();
    });
  }

  function closeScan(){
    scanModal.style.display = "none";
    try { Quagga.stop(); } catch(e) {}
  }

  btnScanContainer.addEventListener("click", openScan);
  btnCloseScan.addEventListener("click", closeScan);

  init();
})();
</script>
</body>
</html>
