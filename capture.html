<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Capture</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* Update: Switch scanner to QR using html5-qrcode, keep manual entry fallback.
       Revision: 2026-03-15.v7 */
    #authStatus{ display:none !important; }

    .modalBackdrop{
      position:fixed !important;
      inset:0 !important;
      background:rgba(0,0,0,.72) !important;
      display:none;
      align-items:center !important;
      justify-content:center !important;
      z-index:9999 !important;
      padding:16px !important;
    }
    .modal{
      width:min(760px,96vw) !important;
      max-height:92vh !important;
      overflow:auto !important;
      background:var(--card2,#0d1628) !important;
      border:1px solid var(--border,#22314f) !important;
      border-radius:16px !important;
      box-shadow:0 12px 32px rgba(0,0,0,.35) !important;
    }
    .modalHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:14px 16px !important;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .modalBody{ padding:14px 16px 18px !important; }
    .videoBox{
      position:relative !important;
      width:100% !important;
      height:340px !important;
      min-height:340px !important;
      overflow:hidden !important;
      background:#000 !important;
      border-radius:14px !important;
      border:1px solid rgba(255,255,255,.12) !important;
    }
    #scanner{
      width:100% !important;
      height:100% !important;
      min-height:340px !important;
    }
    #scanner video,
    #scanner canvas{
      width:100% !important;
      height:100% !important;
      object-fit:cover !important;
      display:block !important;
    }
    .scanHint{
      position:absolute !important;
      top:22% !important;
      left:22% !important;
      width:56% !important;
      height:56% !important;
      border:2px solid rgba(255,255,255,.85) !important;
      border-radius:12px !important;
      box-shadow:0 0 0 2000px rgba(0,0,0,.25) inset !important;
      pointer-events:none !important;
      z-index:5 !important;
    }
    .scanSectionNote{
      padding-left:4px;
      margin-top:10px;
    }
    @media (max-width:640px){
      .videoBox{
        height:300px !important;
        min-height:300px !important;
      }
      #scanner{ min-height:300px !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="navBar"></div>

    <div id="banner" class="banner" style="display:none;"></div>

    <div class="card">
      <h1>Inventory Capture</h1>

      <div id="authStatus" style="font:12px/1.3 system-ui; padding:6px 10px; background:#fff3cd; border:1px solid #ffeeba; border-radius:6px; margin:8px 0;">
        Auth: checking...
      </div>

      <div id="loginBox" style="display:none;">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" />
        <div class="hr"></div>
        <button class="btn" id="btnLogin">Sign In</button>
        <div class="small-note">Sign-in is required before capture/search/container access.</div>
      </div>

      <div id="captureBox" style="display:none;">
        <label>Container Code</label>
        <div class="row">
          <input id="containerCode" type="text" placeholder="e.g. TOTE0076" />
          <button class="btn secondary" id="btnScanContainer" style="max-width:180px;">Scan QR</button>
        </div>
        <div class="small-note" id="containerSetNote"></div>

        <label>Photo (required)</label>
        <input id="photo" type="file" accept="image/*" capture="environment" />

        <label>Description</label>
        <textarea id="desc" placeholder="Item description"></textarea>

        <div class="row">
          <div>
            <label>Quantity</label>
            <input id="qty" type="number" step="0.1" value="1" />
          </div>
          <div></div>
        </div>

        <div class="hr"></div>
        <button class="btn" id="btnSave">Save Item</button>
        <div class="small-note">After save, the form stays ready for the next item in the same container.</div>
      </div>
    </div>
  </div>

  <div class="modalBackdrop" id="scanModal">
    <div class="modal">
      <div class="modalHeader">
        <h3>Scan QR Container Label</h3>
        <button class="btn secondary" id="btnCloseScan" style="width:auto;">Close</button>
      </div>
      <div class="modalBody">
        <div class="videoBox">
          <div class="scanHint"></div>
          <div id="scanner"></div>
        </div>
        <div class="small-note scanSectionNote">Tip: hold steady and center the QR code inside the white square.</div>
      </div>
    </div>
  </div>

<script>
(function(){
  const banner = document.getElementById("banner");
  const loginBox = document.getElementById("loginBox");
  const captureBox = document.getElementById("captureBox");
  const authStatusEl = document.getElementById("authStatus");

  const btnLogin = document.getElementById("btnLogin");
  const btnSave = document.getElementById("btnSave");
  const btnScanContainer = document.getElementById("btnScanContainer");
  const btnCloseScan = document.getElementById("btnCloseScan");
  const scanModal = document.getElementById("scanModal");
  const containerCodeEl = document.getElementById("containerCode");
  const containerSetNote = document.getElementById("containerSetNote");
  const photoEl = document.getElementById("photo");
  const descEl = document.getElementById("desc");
  const qtyEl = document.getElementById("qty");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");

  const sb = getSupabase();
  let qrScanner = null;
  let scanActive = false;

  function focusContainerField(){
    setTimeout(() => {
      if(containerCodeEl){
        containerCodeEl.focus();
        containerCodeEl.select();
      }
    }, 150);
  }

  function setAuthStatus(msg){
    if (authStatusEl) authStatusEl.textContent = msg;
  }

  function setSaveEnabled(enabled){
    btnSave.disabled = !enabled;
    btnSave.style.opacity = enabled ? "1" : "0.6";
    btnSave.style.pointerEvents = enabled ? "auto" : "none";
  }

  function showBanner(type, msg){
    banner.className = "banner " + (type || "ok");
    banner.textContent = msg;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 6500);
  }

  window.addEventListener("error", (evt) => {
    const msg = evt?.message || "Unknown script error";
    setAuthStatus("Auth: error");
    showBanner("err", "Script error: " + msg);
  });

  window.addEventListener("unhandledrejection", (evt) => {
    const msg = evt?.reason?.message || String(evt?.reason || "Unknown promise rejection");
    setAuthStatus("Auth: error");
    showBanner("err", "Unhandled: " + msg);
  });

  function normalizeScannedCode(raw){
    return String(raw || "").trim().toUpperCase();
  }

  async function renderNavSafe(timeoutMs = 1200){
    try{
      if (!window.APP_NAV || typeof window.APP_NAV.render !== "function") return;
      await Promise.race([
        window.APP_NAV.render("navBar"),
        new Promise((res) => setTimeout(res, timeoutMs))
      ]);
    }catch(e){
      console.warn("Nav render failed:", e);
    }
  }

  async function requireAuth(){
    setSaveEnabled(false);
    setAuthStatus("Auth: checking...");
    await renderNavSafe(1200);

    const { data: { session } } = await sb.auth.getSession();
    if (session?.user){
      loginBox.style.display = "none";
      captureBox.style.display = "block";
      setAuthStatus("Auth: OK");
      setSaveEnabled(true);
      focusContainerField();
      return session.user;
    }

    loginBox.style.display = "block";
    captureBox.style.display = "none";
    setAuthStatus("Auth: sign in required");
    return null;
  }

  async function login(){
    try{
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password){
        showBanner("err", "Enter email and password.");
        return;
      }
      setAuthStatus("Auth: signing in...");
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showBanner("ok", "Login successful.");
      await requireAuth();
    }catch(e){
      setAuthStatus("Auth: login failed");
      showBanner("err", "Login failed: " + (e.message || e));
    }
  }

  async function ensureContainer(code){
    let {data,error}=await sb.from("containers")
      .select("container_code")
      .eq("container_code",code)
      .eq("is_active",true)
      .maybeSingle();
    if(error) throw error;
    if(data) return;
    const { error: insErr } = await sb.from("containers").insert([{container_code:code}]);
    if(insErr) throw insErr;
  }

  async function saveItem(){
    try{
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user){
        showBanner("err", "Please sign in first.");
        await requireAuth();
        return;
      }

      const container = String(containerCodeEl.value || "").trim().toUpperCase();
      const photo = photoEl.files?.[0];
      const desc = descEl.value.trim();
      const qty = Number(qtyEl.value || 1);

      if (!container){
        showBanner("err", "Container Code required.");
        focusContainerField();
        return;
      }
      if (!photo){
        showBanner("err", "Photo required.");
        return;
      }
      if (!desc){
        showBanner("err", "Description required.");
        return;
      }

      setSaveEnabled(false);
      await ensureContainer(container);

      const ref_uid = crypto.randomUUID();
      const item_id = crypto.randomUUID();

      const photoPath = `items/${ref_uid}/${item_id}.jpg`;
      const { error: upErr } = await sb.storage
        .from("item-photos")
        .upload(photoPath, photo, { upsert: true });

      if (upErr) throw upErr;

      const { error: insErr } = await sb
        .from("items")
        .insert([{
          item_id,
          ref_uid,
          container_code: container,
          item_description: desc,
          quantity: qty,
          photo_path: photoPath,
          is_active: true,
          created_by: session.user.id,
          updated_by: session.user.id
        }]);

      if (insErr) throw insErr;

      descEl.value = "";
      photoEl.value = "";
      qtyEl.value = "1";
      containerSetNote.textContent = `Container set: ${container}`;
      focusContainerField();
      showBanner("ok", `Saved item to ${container}`);
    }catch(e){
      showBanner("err", "Save failed: " + (e.message || e));
    }finally{
      setSaveEnabled(true);
    }
  }

  async function closeScan(){
    scanModal.style.display = "none";
    document.body.style.overflow = "";
    scanActive = false;
    try {
      if (qrScanner){
        await qrScanner.stop();
        await qrScanner.clear();
        qrScanner = null;
      }
    } catch(e) {}
  }

  async function openScan(){
    if (scanActive) return;
    scanActive = true;
    scanModal.style.display = "flex";
    document.body.style.overflow = "hidden";
    const scannerTarget = document.getElementById("scanner");
    scannerTarget.innerHTML = "";
    showBanner("ok", "Camera opened. Aim the QR code inside the white square.");

    try{
      qrScanner = new Html5Qrcode("scanner");
      await qrScanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.777
        },
        (decodedText) => {
          const normalized = normalizeScannedCode(decodedText);
          if (!normalized) return;
          containerCodeEl.value = normalized;
          containerSetNote.textContent = `Container set: ${normalized}`;
          showBanner("ok", `Scanned: ${normalized}`);
          closeScan();
          focusContainerField();
        },
        () => {
          // ignore scan misses
        }
      );
    } catch (err){
      showBanner("err", "Scanner init failed: " + (err.message || err));
      await closeScan();
    }
  }

  btnLogin?.addEventListener("click", login);
  btnSave?.addEventListener("click", saveItem);
  btnScanContainer?.addEventListener("click", () => openScan());
  btnCloseScan?.addEventListener("click", () => closeScan());

  containerCodeEl?.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      photoEl.focus();
    }
  });

  document.addEventListener("DOMContentLoaded", focusContainerField);

  requireAuth();
})();
</script>
</body>
</html>
