<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inventory Capture</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:system-ui;background:#f6f6f6;margin:0;padding:20px}
.card{background:white;padding:20px;border-radius:8px;max-width:700px;margin:auto}
.banner{display:none;padding:10px;margin-bottom:10px;border-radius:6px}
.banner.ok{background:#d4edda}
.banner.err{background:#f8d7da}
.banner.warn{background:#fff3cd}
input,textarea{width:100%;padding:8px;margin:6px 0}
button{padding:10px 14px;margin-top:10px}
</style>
</head>
<body>

<div class="card">
<div id="banner" class="banner"></div>

<h2>Inventory Capture</h2>

<label>Container Code</label>
<input id="containerCode"/>

<label>Description</label>
<textarea id="desc"></textarea>

<label>Photo (optional)</label>
<input id="photo" type="file" accept="image/*"/>

<label>Quantity</label>
<input id="qty" type="number" value="1"/>

<button id="saveBtn">Save Item</button>

</div>

<script>

const banner=document.getElementById("banner")
function showBanner(type,msg){
banner.className="banner "+type
banner.textContent=msg
banner.style.display="block"
setTimeout(()=>banner.style.display="none",5000)
}

const sb=getSupabase()

function normalizeContainer(code){
return String(code||"").trim().toUpperCase()
}

async function ensureContainer(code){
let {data,error}=await sb
.from("containers")
.select("container_code")
.eq("container_code",code)
.eq("is_active",true)
.maybeSingle()

if(error) throw error

if(data) return

await sb.from("containers").insert([{container_code:code}])
}

async function saveItem(){

const container=normalizeContainer(containerCode.value)
const desc=descEl.value.trim()
const qty=Number(qtyEl.value||1)
const photo=photoEl.files[0]

if(!container){
showBanner("err","Container required")
return
}

if(!photo && !desc){
showBanner("err","Photo or description required")
return
}

await ensureContainer(container)

let photo_path=null
const item_id=crypto.randomUUID()

if(photo){
photo_path=`items/${item_id}.jpg`
const {error:uploadErr}=await sb.storage
.from("item-photos")
.upload(photo_path,photo)

if(uploadErr) throw uploadErr
}

const {error}=await sb.from("items").insert([{
item_id:item_id,
ref_uid:item_id,
container_code:container,
item_description:desc,
quantity:qty,
photo_path:photo_path
}])

if(error) throw error

showBanner("ok","✓ Item saved to "+container)

descEl.value=""
photoEl.value=""
qtyEl.value="1"

}

const containerCode=document.getElementById("containerCode")
const descEl=document.getElementById("desc")
const photoEl=document.getElementById("photo")
const qtyEl=document.getElementById("qty")
const saveBtn=document.getElementById("saveBtn")

saveBtn.addEventListener("click",saveItem)

</script>

</body>
</html>
