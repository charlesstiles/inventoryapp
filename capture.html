<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Capture</title>

  <!-- Supabase JS (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quagga2 for barcode scanning (supports Code 39) -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <!-- Shared config (add config.js at repo root) -->
  <script src="./config.js"></script>

  <!-- Shared navigation (add navigation.js at repo root) -->
  <script src="./navigation.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 { font-size: 20px; margin: 0; }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      min-width: 160px;
    }

    a.link-btn {
      display: inline-block;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e3a8a;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 800;
      background: #fff;
      text-align: center;
      white-space: nowrap;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.06);
    }

    label {
      display: block;
      margin-top: 10px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30,58,138,0.15);
    }

    textarea { min-height: 90px; resize: vertical; }

    .btn {
      background: #1e3a8a;
      color: #fff;
      border: none;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: #fff;
      color: #1e3a8a;
      border: 1px solid #1e3a8a;
      font-weight: 800;
      cursor: pointer;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .hidden { display: none; }

    .success, .error, .info {
      padding: 10px;
      margin-top: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 800;
    }
    .success { background: #16a34a; color: #fff; }
    .error { background: #dc2626; color: #fff; }
    .info { background: #0ea5e9; color: #fff; }

    .small {
      color: #64748b;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
    }

    /* Scanner overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      z-index: 9999;
      padding: 16px;
      box-sizing: border-box;
    }

    .overlay-inner {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #0b1220;
      border: 1px solid rgba(226,232,240,0.2);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
    }

    .overlay-header button {
      width: auto;
      margin-top: 0;
      padding: 10px 12px;
      border-radius: 10px;
    }

    /* ✅ Preview stability + "contain" to prevent crop/zoom */
    #scannerArea {
      position: relative;
      width: 100%;
      height: 70vh;
      background: #000;
      overflow: hidden;
      border-radius: 0;
    }
    #scannerArea video,
    #scannerArea canvas {
      position: absolute !important;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }

    .scan-guide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .scan-frame {
      width: 80%;
      height: 35%;
      border: 3px solid rgba(255,255,255,0.85);
      border-radius: 14px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.25);
    }

    .overlay-footer {
      padding: 12px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.35;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <header>
    <h1>Inventory Capture</h1>
  <div id="navBar" class="top-actions"></div>
  </header>

  <!-- Login -->
  <div id="loginCard" class="card">
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" />

    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />

    <button id="signInBtn" type="button" class="btn">Sign In</button>

    <div class="small">
      Tip: after deploying, open with <b>?v=123</b> to bust cache.
    </div>

    <div id="loginMsg"></div>
  </div>

  <!-- Capture -->
  <div id="captureCard" class="card hidden">
    <label for="containerInput">Container Code</label>
    <input id="containerInput" placeholder="e.g. TOTE0076" />

    <div class="row3">
      <button id="scanContainerBtn" type="button" class="btn-secondary">Scan Container</button>
      <button id="changeContainerBtn" type="button" class="btn-secondary">Change Container</button>
      <button id="logoutBtn" type="button" class="btn-secondary">Logout</button>
    </div>

    <label for="photoInput">Photo (required)</label>
    <input id="photoInput" type="file" accept="image/*" capture="environment" />

    <label for="descInput">Description</label>
    <textarea id="descInput" placeholder="Item description"></textarea>

    <button id="saveBtn" type="button" class="btn">Save Item</button>

    <div id="captureMsg"></div>
  </div>

  <!-- Scanner Overlay -->
  <div id="scannerOverlay" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="overlay-header">
        <div>Scan Code 39 Container Label</div>
        <button id="scannerCloseBtn" class="btn-secondary" type="button">Close</button>
      </div>

      <div id="scannerArea">
        <div class="scan-guide">
          <div class="scan-frame"></div>
        </div>
      </div>

      <div class="overlay-footer">
        Hold the barcode inside the frame. When detected, it will auto-fill the container code.
        <div style="margin-top:8px;">Last scan: <span id="lastScan" class="mono">—</span></div>
        <div id="scanErr" style="margin-top:8px;color:#fca5a5;font-weight:800;"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ---- Shared config ----
      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Missing config.js or SUPABASE settings. Ensure config.js exists and is loaded.");
        return;
      }
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;

      if (!window.supabase || !window.supabase.createClient) {
        alert("Supabase JS library failed to load. Check your network and refresh.");
        return;
      }
      if (!window.Quagga) {
        alert("Scanner library (Quagga2) failed to load. Check your network and refresh.");
        return;
      }

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // DOM
      const loginCard = document.getElementById("loginCard");
      const captureCard = document.getElementById("captureCard");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const signInBtn = document.getElementById("signInBtn");
      const loginMsg = document.getElementById("loginMsg");

      const containerInput = document.getElementById("containerInput");
      const scanContainerBtn = document.getElementById("scanContainerBtn");
      const changeContainerBtn = document.getElementById("changeContainerBtn");
      const photoInput = document.getElementById("photoInput");
      const descInput = document.getElementById("descInput");
      const saveBtn = document.getElementById("saveBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const captureMsg = document.getElementById("captureMsg");

      const scannerOverlay = document.getElementById("scannerOverlay");
      const scannerCloseBtn = document.getElementById("scannerCloseBtn");
      const lastScan = document.getElementById("lastScan");
      const scanErr = document.getElementById("scanErr");
  
      window.APP_NAV.render("navBar");

      const escapeHtml = (str) =>
        String(str).replace(/[&<>"']/g, s => ({
          "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
        }[s]));

      const showLoginError = (text) => {
        loginMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
      };

      const showCaptureError = (text) => {
        captureMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
      };

      const showCaptureSuccess = (text) => {
        captureMsg.innerHTML = `<div class="success">${escapeHtml(text)}</div>`;
        setTimeout(() => captureMsg.innerHTML = "", 1200);
      };

      const showCaptureInfo = (text) => {
        captureMsg.innerHTML = `<div class="info">${escapeHtml(text)}</div>`;
      };

      async function refreshUI() {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          loginCard.classList.add("hidden");
          captureCard.classList.remove("hidden");
          if (!containerInput.value.trim()) containerInput.focus();
          else photoInput.focus();
        } else {
          captureCard.classList.add("hidden");
          loginCard.classList.remove("hidden");
          emailInput.focus();
        }
      }

      // Login
      signInBtn.addEventListener("click", async () => {
        signInBtn.disabled = true;
        loginMsg.innerHTML = "";
        try {
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email || !password) {
            showLoginError("Email and password are required.");
            return;
          }

          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            showLoginError(error.message);
            return;
          }

          await refreshUI();
        } catch (e) {
          showLoginError(e?.message || String(e));
        } finally {
          signInBtn.disabled = false;
        }
      });

      // Logout
      logoutBtn.addEventListener("click", async () => {
        await stopScannerIfRunning();
        await sb.auth.signOut();
        await refreshUI();
      });

      // Change container
      changeContainerBtn.addEventListener("click", () => {
        containerInput.value = "";
        containerInput.focus();
        showCaptureInfo("Enter/scan a new container.");
      });

      // Save item (auto-create container)
      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        captureMsg.innerHTML = "";

        try {
          const containerCode = containerInput.value.trim();
          const description = descInput.value.trim();
          const file = photoInput.files?.[0];

          if (!containerCode) { showCaptureError("Container code is required."); return; }
          if (!file) { showCaptureError("Photo is required."); return; }
          if (!description) { showCaptureError("Description is required."); return; }

          // Ensure container exists
          const upsertContainer = await sb
            .from("containers")
            .upsert({ container_code: containerCode }, { onConflict: "container_code" });

          if (upsertContainer.error) {
            showCaptureError("Container create failed: " + upsertContainer.error.message);
            return;
          }

          // Upload photo
          const safeName = (file.name || "photo.jpg").replace(/[^\w.\-]/g, "_");
          const filePath = `${containerCode}/${Date.now()}_${safeName}`;

          const up = await sb.storage
            .from("item-photos")
            .upload(filePath, file, { upsert: false });

          if (up.error) {
            showCaptureError("Upload failed: " + up.error.message);
            return;
          }

          // Insert item
          const ins = await sb.from("items").insert({
            container_code: containerCode,
            item_description: description,
            photo_path: filePath
          });

          if (ins.error) {
            showCaptureError("Save failed: " + ins.error.message);
            return;
          }

          // Reset for next item
          descInput.value = "";
          photoInput.value = "";
          showCaptureSuccess("Saved ✓");
          photoInput.focus();
        } catch (e) {
          showCaptureError(e?.message || String(e));
        } finally {
          saveBtn.disabled = false;
        }
      });

      // ----------------------------
      // Scanner (Code 39) - stable preview + lowercase (Full ASCII) decode
      // ----------------------------
      let scannerRunning = false;
      let lastDetectedAt = 0;
      let didDecode = false;

      function openScanner() {
        scanErr.textContent = "";
        lastScan.textContent = "Scanning…";
        didDecode = false;

        scannerOverlay.style.display = "block";
        scannerOverlay.setAttribute("aria-hidden", "false");
        startScanner();
      }

      async function closeScanner() {
        await stopScannerIfRunning();
        scannerOverlay.style.display = "none";
        scannerOverlay.setAttribute("aria-hidden", "true");
      }

      scannerCloseBtn.addEventListener("click", closeScanner);
      scannerOverlay.addEventListener("click", (e) => {
        if (e.target === scannerOverlay) closeScanner();
      });
      scanContainerBtn.addEventListener("click", () => openScanner());

      function decodeCode39FullASCII(s) {
        // +A..+Z => a..z (fixes A+A-1234 => Aa-1234)
        return String(s || "").replace(/\+([A-Z])/g, (_, ch) => ch.toLowerCase());
      }

      function normalizeCode39(value) {
        const raw = String(value || "").trim().replace(/^\*+|\*+$/g, "");
        // If you want to force ALL container codes uppercase, append .toUpperCase()
        return decodeCode39FullASCII(raw);
      }

      // 4:3 tends to reduce weird crop/snap-zoom on many Android devices
      function getCameraConstraints() {
        return {
          facingMode: { ideal: "environment" },
          aspectRatio: { ideal: 4 / 3 },
          width:  { ideal: 1280 },
          height: { ideal: 960 }
        };
      }

      // If browser exposes zoom capability, force minimum after start
      async function forceMinZoomIfSupported() {
        try {
          const ca = Quagga.CameraAccess;
          const track = (ca && typeof ca.getActiveTrack === "function") ? ca.getActiveTrack() : null;
          if (!track) return;

          const caps = track.getCapabilities ? track.getCapabilities() : null;
          if (!caps || !caps.zoom) return;

          const minZoom = (caps.zoom.min != null) ? caps.zoom.min : 1;
          await track.applyConstraints({ advanced: [{ zoom: minZoom }] });
        } catch (_) { /* ignore */ }
      }

      function startScanner() {
        if (scannerRunning) return;

        scanErr.textContent = "";
        lastScan.textContent = "Scanning…";

        const config = {
          inputStream: {
            type: "LiveStream",
            target: document.querySelector("#scannerArea"),
            constraints: getCameraConstraints()
          },
          locator: { patchSize: "x-large", halfSample: false },
          numOfWorkers: 0,
          frequency: 10,
          decoder: { readers: ["code_39_reader"] },
          locate: true,
          area: { top: "20%", right: "5%", left: "5%", bottom: "20%" }
        };

        Quagga.init(config, (err) => {
          if (err) {
            scanErr.textContent = "Scanner init failed: " + (err.message || String(err));
            return;
          }
          Quagga.start();
          scannerRunning = true;
          setTimeout(() => { forceMinZoomIfSupported(); }, 250);
        });

        Quagga.onProcessed((result) => {
          if (!scannerRunning || didDecode) return;
          const hasCandidates = !!(result && result.boxes && result.boxes.length);
          lastScan.textContent = hasCandidates ? "Scanning… (candidate detected)" : "Scanning…";
          if (hasCandidates) scanErr.textContent = "";
        });

        Quagga.onDetected(onDetected);

        setTimeout(() => {
          if (scannerRunning && !didDecode) {
            scanErr.textContent =
              "No decode yet. Move closer, center barcode, tilt to reduce glare, or increase label size.";
          }
        }, 7000);
      }

      async function stopScannerIfRunning() {
        if (!scannerRunning) return;
        try {
          Quagga.offDetected(onDetected);
          Quagga.offProcessed();
          Quagga.stop();
        } catch (_) { /* ignore */ }
        scannerRunning = false;
      }

      async function onDetected(result) {
        const now = Date.now();
        if (now - lastDetectedAt < 900) return;
        lastDetectedAt = now;

        const code = normalizeCode39(result?.codeResult?.code);
        if (!code) return;

        didDecode = true;
        lastScan.textContent = code;
        containerInput.value = code;

        await closeScanner();
        photoInput.focus();
        showCaptureInfo("Container set: " + code);
      }

      // Init
      refreshUI();
    });
  </script>
</body>
</html>
