<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Capture</title>

  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <script src="./config.js"></script>
  <script src="./navigation.js"></script>

  <style>
    /* Page-specific only */
  </style>
</head>

<body>
  <header>
    <h1>Inventory Capture</h1>
    <div id="navBar"></div>
  </header>

  <!-- Login -->
  <div id="loginCard" class="card">
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" />

    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />

    <button id="signInBtn" type="button" class="btn">Sign In</button>

    <div class="small">Tip: open with <b>?v=123</b> to bust cache.</div>
    <div id="loginMsg"></div>
  </div>

  <!-- Capture -->
  <div id="captureCard" class="card hidden">
    <label for="containerInput">Container Code</label>
    <input id="containerInput" placeholder="e.g. TOTE0076" />

    <div class="row3">
      <button id="scanContainerBtn" type="button" class="btn-secondary">Scan Container</button>
      <button id="changeContainerBtn" type="button" class="btn-secondary">Change Container</button>
      <button id="logoutBtn" type="button" class="btn-secondary">Logout</button>
    </div>

    <label for="photoInput">Photo (required)</label>
    <input id="photoInput" type="file" accept="image/*" capture="environment" />

    <label for="descInput">Description</label>
    <textarea id="descInput" placeholder="Item description"></textarea>

    <button id="saveBtn" type="button" class="btn">Save Item</button>

    <div id="captureMsg"></div>
  </div>

  <!-- Scanner Overlay -->
  <div id="scannerOverlay" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="overlay-header">
        <div>Scan Code 39 Container Label</div>
        <button id="scannerCloseBtn" class="btn-secondary" type="button">Close</button>
      </div>

      <div id="scannerArea">
        <div class="scan-guide"><div class="scan-frame"></div></div>
      </div>

      <div class="overlay-footer">
        Hold barcode inside the frame. It will auto-fill the container code.
        <div style="margin-top:8px;">Last scan: <span id="lastScan" class="mono">—</span></div>
        <div id="scanErr" style="margin-top:8px;color:#fca5a5;font-weight:900;"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.APP_NAV) window.APP_NAV.render("navBar");

      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Missing config.js settings.");
        return;
      }
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // DOM
      const loginCard = document.getElementById("loginCard");
      const captureCard = document.getElementById("captureCard");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const signInBtn = document.getElementById("signInBtn");
      const loginMsg = document.getElementById("loginMsg");

      const containerInput = document.getElementById("containerInput");
      const scanContainerBtn = document.getElementById("scanContainerBtn");
      const changeContainerBtn = document.getElementById("changeContainerBtn");
      const photoInput = document.getElementById("photoInput");
      const descInput = document.getElementById("descInput");
      const saveBtn = document.getElementById("saveBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const captureMsg = document.getElementById("captureMsg");

      const scannerOverlay = document.getElementById("scannerOverlay");
      const scannerCloseBtn = document.getElementById("scannerCloseBtn");
      const lastScan = document.getElementById("lastScan");
      const scanErr = document.getElementById("scanErr");

      const escapeHtml = (str) =>
        String(str).replace(/[&<>"']/g, s => ({
          "&":"&amp;","<":"&lt;",">":"&gt;", "\"":"&quot;","'":"&#39;"
        }[s]));

      const showLoginError = (text) => loginMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
      const showCaptureError = (text) => captureMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
      const showCaptureSuccess = (text) => {
        captureMsg.innerHTML = `<div class="success">${escapeHtml(text)}</div>`;
        setTimeout(() => captureMsg.innerHTML = "", 1200);
      };
      const showCaptureInfo = (text) => captureMsg.innerHTML = `<div class="info">${escapeHtml(text)}</div>`;

      async function refreshUI() {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          loginCard.classList.add("hidden");
          captureCard.classList.remove("hidden");
          if (!containerInput.value.trim()) containerInput.focus();
          else photoInput.focus();
        } else {
          captureCard.classList.add("hidden");
          loginCard.classList.remove("hidden");
          emailInput.focus();
        }
      }

      signInBtn.addEventListener("click", async () => {
        signInBtn.disabled = true;
        loginMsg.innerHTML = "";
        try {
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          if (!email || !password) { showLoginError("Email and password are required."); return; }

          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) { showLoginError(error.message); return; }

          await refreshUI();
        } catch (e) {
          showLoginError(e?.message || String(e));
        } finally {
          signInBtn.disabled = false;
        }
      });

      logoutBtn.addEventListener("click", async () => {
        await stopScannerIfRunning();
        await sb.auth.signOut();
        await refreshUI();
      });

      changeContainerBtn.addEventListener("click", () => {
        containerInput.value = "";
        containerInput.focus();
        showCaptureInfo("Enter/scan a new container.");
      });

      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        captureMsg.innerHTML = "";
        try {
          const containerCode = containerInput.value.trim();
          const description = descInput.value.trim();
          const file = photoInput.files?.[0];

          if (!containerCode) { showCaptureError("Container code is required."); return; }
          if (!file) { showCaptureError("Photo is required."); return; }
          if (!description) { showCaptureError("Description is required."); return; }

          const upsertContainer = await sb
            .from("containers")
            .upsert({ container_code: containerCode }, { onConflict: "container_code" });

          if (upsertContainer.error) {
            showCaptureError("Container create failed: " + upsertContainer.error.message);
            return;
          }

          const safeName = (file.name || "photo.jpg").replace(/[^\w.\-]/g, "_");
          const filePath = `${containerCode}/${Date.now()}_${safeName}`;

          const up = await sb.storage
            .from("item-photos")
            .upload(filePath, file, { upsert: false });

          if (up.error) { showCaptureError("Upload failed: " + up.error.message); return; }

          const ins = await sb.from("items").insert({
            container_code: containerCode,
            item_description: description,
            photo_path: filePath
          });

          if (ins.error) { showCaptureError("Save failed: " + ins.error.message); return; }

          descInput.value = "";
          photoInput.value = "";
          showCaptureSuccess("Saved ✓");
          photoInput.focus();
        } catch (e) {
          showCaptureError(e?.message || String(e));
        } finally {
          saveBtn.disabled = false;
        }
      });

      // Scanner
      let scannerRunning = false;
      let lastDetectedAt = 0;
      let didDecode = false;

      scanContainerBtn.addEventListener("click", () => openScanner());
      scannerCloseBtn.addEventListener("click", () => closeScanner());
      scannerOverlay.addEventListener("click", (e) => { if (e.target === scannerOverlay) closeScanner(); });

      function decodeCode39FullASCII(s) {
        return String(s || "").replace(/\+([A-Z])/g, (_, ch) => ch.toLowerCase());
      }
      function normalizeCode39(value) {
        const raw = String(value || "").trim().replace(/^\*+|\*+$/g, "");
        return decodeCode39FullASCII(raw);
      }
      function getCameraConstraints() {
        return {
          facingMode: { ideal: "environment" },
          aspectRatio: { ideal: 4 / 3 },
          width:  { ideal: 1280 },
          height: { ideal: 960 }
        };
      }
      async function forceMinZoomIfSupported() {
        try {
          const ca = Quagga.CameraAccess;
          const track = (ca && typeof ca.getActiveTrack === "function") ? ca.getActiveTrack() : null;
          if (!track) return;
          const caps = track.getCapabilities ? track.getCapabilities() : null;
          if (!caps || !caps.zoom) return;
          const minZoom = (caps.zoom.min != null) ? caps.zoom.min : 1;
          await track.applyConstraints({ advanced: [{ zoom: minZoom }] });
        } catch (_) {}
      }

      function openScanner() {
        scanErr.textContent = "";
        lastScan.textContent = "Scanning…";
        didDecode = false;
        scannerOverlay.style.display = "block";
        scannerOverlay.setAttribute("aria-hidden", "false");
        startScanner();
      }
      async function closeScanner() {
        await stopScannerIfRunning();
        scannerOverlay.style.display = "none";
        scannerOverlay.setAttribute("aria-hidden", "true");
      }

      function startScanner() {
        if (scannerRunning) return;

        const config = {
          inputStream: {
            type: "LiveStream",
            target: document.querySelector("#scannerArea"),
            constraints: getCameraConstraints()
          },
          locator: { patchSize: "x-large", halfSample: false },
          numOfWorkers: 0,
          frequency: 10,
          decoder: { readers: ["code_39_reader"] },
          locate: true,
          area: { top: "20%", right: "5%", left: "5%", bottom: "20%" }
        };

        Quagga.init(config, (err) => {
          if (err) {
            scanErr.textContent = "Scanner init failed: " + (err.message || String(err));
            return;
          }
          Quagga.start();
          scannerRunning = true;
          setTimeout(() => { forceMinZoomIfSupported(); }, 250);
        });

        Quagga.onProcessed((result) => {
          if (!scannerRunning || didDecode) return;
          const hasCandidates = !!(result && result.boxes && result.boxes.length);
          lastScan.textContent = hasCandidates ? "Scanning… (candidate detected)" : "Scanning…";
          if (hasCandidates) scanErr.textContent = "";
        });

        Quagga.onDetected(onDetected);

        setTimeout(() => {
          if (scannerRunning && !didDecode) {
            scanErr.textContent =
              "No decode yet. Move closer, center barcode, tilt to reduce glare, or increase label size.";
          }
        }, 7000);
      }

      async function stopScannerIfRunning() {
        if (!scannerRunning) return;
        try {
          Quagga.offDetected(onDetected);
          Quagga.offProcessed();
          Quagga.stop();
        } catch (_) {}
        scannerRunning = false;
      }

      async function onDetected(result) {
        const now = Date.now();
        if (now - lastDetectedAt < 900) return;
        lastDetectedAt = now;

        const code = normalizeCode39(result?.codeResult?.code);
        if (!code) return;

        didDecode = true;
        lastScan.textContent = code;
        containerInput.value = code;

        await closeScanner();
        photoInput.focus();
        showCaptureInfo("Container set: " + code);
      }

      refreshUI();
    });
  </script>
</body>
</html>
