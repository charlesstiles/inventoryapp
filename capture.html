<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Capture</title>
  <link rel="stylesheet" href="./styles.css?v=1" />
  <script src="./config.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./navigation.js?v=1"></script>
  <!-- QuaggaJS for Code39 scan -->
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
</head>
<body>
  <header>
    <h1>Inventory Capture</h1>
    <div id="navBar"></div>
  </header>

  <!-- AUTH CARD -->
  <div id="authCard" class="card">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <button id="btnSignIn" class="btn">Sign In</button>
    <div id="authMsg" class="error hidden"></div>
    <div class="small muted">Tip: add <span class="mono">?v=123</span> to bust cache.</div>
  </div>

  <!-- CAPTURE CARD -->
  <div id="captureCard" class="card hidden">
    <label for="containerCode">Container Code</label>
    <input id="containerCode" type="text" placeholder="e.g. TOTE0076" />

    <div class="row3">
      <button id="btnScanContainer" class="btn-secondary">Scan Container</button>
      <button id="btnChangeContainer" class="btn-secondary">Change Container</button>
      <button id="btnClearContainer" class="btn-secondary">Clear</button>
    </div>

    <label for="photo">Photo (required)</label>
    <input id="photo" type="file" accept="image/*" capture="environment" />

    <label for="description">Description</label>
    <textarea id="description" rows="3" placeholder="Item description"></textarea>

    <button id="btnSave" class="btn">Save Item</button>

    <div id="saveMsg" class="success hidden"></div>
    <div id="errMsg" class="error hidden"></div>

    <div class="small muted" id="lastScan">Last scan: —</div>
  </div>

  <!-- SCANNER OVERLAY -->
  <div id="scanOverlay" class="overlay">
    <div class="overlay-inner">
      <div class="overlay-header">
        <div>
          Scan Code 39 Container Label
          <div class="meta">Hold barcode inside the frame. It will auto-fill the container code.</div>
        </div>
        <button id="btnScanClose" class="btn-secondary">Close</button>
      </div>

      <div id="scannerArea">
        <div class="scan-guide">
          <div class="scan-frame"></div>
        </div>
      </div>

      <div class="overlay-footer">
        If it feels “zoomed”, keep the barcode centered in the frame and move the phone back slightly.
      </div>
    </div>
  </div>

<script>
(() => {
  // ---- Setup Supabase ----
  const cfg = window.APP_CONFIG || {};
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  window.APP_SUPABASE = sb;

  // ---- DOM ----
  const authCard = document.getElementById("authCard");
  const captureCard = document.getElementById("captureCard");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const btnSignIn = document.getElementById("btnSignIn");
  const authMsg = document.getElementById("authMsg");

  const containerCodeEl = document.getElementById("containerCode");
  const btnScanContainer = document.getElementById("btnScanContainer");
  const btnChangeContainer = document.getElementById("btnChangeContainer");
  const btnClearContainer = document.getElementById("btnClearContainer");

  const photoEl = document.getElementById("photo");
  const descEl = document.getElementById("description");
  const btnSave = document.getElementById("btnSave");
  const saveMsg = document.getElementById("saveMsg");
  const errMsg = document.getElementById("errMsg");
  const lastScan = document.getElementById("lastScan");

  const overlay = document.getElementById("scanOverlay");
  const btnScanClose = document.getElementById("btnScanClose");

  // ---- Helpers ----
  function show(el, text) { el.textContent = text || ""; el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); el.textContent = ""; }
  function normCode39(s) {
    // Code39 Full ASCII can introduce punctuation; we keep it literal but normalize whitespace.
    // Also normalize common lowercase input by leaving as-is (your labels might use it).
    return (s || "").trim().replace(/\s+/g, " ");
  }

  async function requireSession() {
    const { data } = await sb.auth.getSession();
    return data?.session || null;
  }

  async function setAuthedUI(isAuthed) {
    if (isAuthed) {
      authCard.classList.add("hidden");
      captureCard.classList.remove("hidden");
    } else {
      captureCard.classList.add("hidden");
      authCard.classList.remove("hidden");
    }
    // Render nav after APP_SUPABASE exists
    if (window.APP_NAV?.render) await window.APP_NAV.render("navBar");
  }

  // ---- Boot ----
  (async () => {
    const session = await requireSession();
    await setAuthedUI(!!session);
  })();

  // ---- Sign in ----
  btnSignIn.addEventListener("click", async () => {
    hide(authMsg);
    const email = (emailEl.value || "").trim();
    const password = passEl.value || "";
    if (!email || !password) return show(authMsg, "Enter email and password.");

    btnSignIn.disabled = true;
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return show(authMsg, error.message || "Login failed.");
      await setAuthedUI(true);
    } finally {
      btnSignIn.disabled = false;
    }
  });

  // ---- Container buttons ----
  btnClearContainer.addEventListener("click", () => {
    containerCodeEl.value = "";
    containerCodeEl.focus();
  });

  btnChangeContainer.addEventListener("click", () => {
    containerCodeEl.focus();
    containerCodeEl.select();
  });

  // ---- Scanner ----
  function stopScanner() {
    try { Quagga.stop(); } catch (_) {}
  }

  function openScanner() {
    hide(errMsg);
    overlay.style.display = "block";

    // Clear previous
    stopScanner();
    lastScan.textContent = "Last scan: —";

    Quagga.init({
      inputStream: {
        type: "LiveStream",
        target: document.querySelector("#scannerArea"),
        constraints: { facingMode: "environment" },
        area: { top: "15%", right: "10%", left: "10%", bottom: "15%" }
      },
      decoder: {
        readers: ["code_39_reader"],
        multiple: false
      },
      locate: true,
      numOfWorkers: 1
    }, (err) => {
      if (err) {
        show(errMsg, "Scanner init failed: " + err.message);
        return;
      }
      Quagga.start();
    });

    Quagga.offDetected();
    Quagga.onDetected((result) => {
      const code = normCode39(result?.codeResult?.code);
      if (!code) return;
      containerCodeEl.value = code;
      lastScan.textContent = "Last scan: " + code;
      overlay.style.display = "none";
      stopScanner();
    });
  }

  btnScanContainer.addEventListener("click", openScanner);

  btnScanClose.addEventListener("click", () => {
    overlay.style.display = "none";
    stopScanner();
  });

  // ---- Save Item ----
  btnSave.addEventListener("click", async () => {
    hide(saveMsg); hide(errMsg);

    const session = await requireSession();
    if (!session) return show(errMsg, "Please sign in.");

    const container_code = normCode39(containerCodeEl.value);
    const desc = (descEl.value || "").trim();
    const file = photoEl.files?.[0] || null;

    if (!container_code) return show(errMsg, "Container Code is required.");
    if (!file) return show(errMsg, "Photo is required.");

    btnSave.disabled = true;
    try {
      // 1) Ensure container exists (auto-create if not)
      const { data: existing, error: cSelErr } = await sb
        .from("containers")
        .select("container_id, container_code, ref_uid")
        .eq("container_code", container_code)
        .limit(1);

      if (cSelErr) throw cSelErr;

      let containerRefUid = existing?.[0]?.ref_uid || null;

      if (!existing || existing.length === 0) {
        const payload = {
          container_code,
          created_by: session.user.id
        };

        const { data: cIns, error: cInsErr } = await sb
          .from("containers")
          .insert(payload)
          .select("ref_uid, container_code")
          .single();

        if (cInsErr) throw cInsErr;
        containerRefUid = cIns.ref_uid;

        // Redirect to container_detail for enrichment (page may be added later)
        // If container_detail.html does not exist yet, comment these 4 lines out.
        const returnTo = "./capture.html";
        location.href =
          `./container_detail.html?ref_uid=${encodeURIComponent(containerRefUid)}` +
          `&return=capture&return_url=${encodeURIComponent(returnTo)}`;
        return;
      }

      // 2) Upload photo
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const path = `items/${session.user.id}/${Date.now()}_${Math.random().toString(16).slice(2)}.${ext}`;

      const { error: upErr } = await sb.storage
        .from("item-photos")
        .upload(path, file, { upsert: false, cacheControl: "3600" });

      if (upErr) throw upErr;

      // 3) Insert item row
      const itemPayload = {
        container_code,
        description: desc,
        photo_path: path,
        created_by: session.user.id,
        container_ref_uid: containerRefUid
      };

      const { error: iErr } = await sb.from("items").insert(itemPayload);
      if (iErr) throw iErr;

      show(saveMsg, "DONE");
      // reset photo/desc for next item in same container
      photoEl.value = "";
      descEl.value = "";
      descEl.focus();
    } catch (e) {
      show(errMsg, (e && e.message) ? e.message : String(e));
    } finally {
      btnSave.disabled = false;
    }
  });
})();
</script>
</body>
</html>
