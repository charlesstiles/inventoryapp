<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Capture</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    h2 { margin-top: 0; }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
    }
    button {
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 16px;
    }
    .hidden { display: none; }
    .success {
      background: #16a34a;
      color: white;
      padding: 8px;
      margin-top: 12px;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>Inventory Capture</h2>

  <div style="padding:8px;border:2px dashed #000;margin-bottom:12px;">
  VERSION: v4-fingerprint-01
</div>

<div id="login">
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="login()">Sign In</button>
</div>

<div id="capture" class="hidden">
  <input id="container" placeholder="Container Code (e.g. TOTE0076)" />
  <input id="photo" type="file" accept="image/*" capture="environment" />
  <textarea id="desc" placeholder="Item description"></textarea>
  <button onclick="saveItem()">Save Item</button>
  <div id="msg"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ====== DEBUG BANNER ======
  const debugBar = document.createElement("div");
  debugBar.style.cssText = "padding:10px;border-radius:10px;margin:12px 0;font-weight:700;";
  debugBar.textContent = "JS running…";
  debugBar.style.background = "#16a34a";
  debugBar.style.color = "#fff";
  document.body.insertBefore(debugBar, document.body.firstChild);

  window.addEventListener("error", (e) => {
    debugBar.textContent = "JS ERROR: " + (e?.message || "unknown error");
    debugBar.style.background = "#dc2626";
  });

  // ====== CONFIG ======
  const SUPABASE_URL = "https://htmqdzvepyhpklrykjgh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0bXFkenZlcHlocGtscnlramdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NzAzMjEsImV4cCI6MjA4MzA0NjMyMX0.nC_2KfGq6LGUhYjNQTXMFM_7Q_P0MflXEhV_GP1D16M";

  if (!window.supabase || !window.supabase.createClient) {
    debugBar.textContent = "Supabase JS not loaded";
    debugBar.style.background = "#dc2626";
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ====== DOM REFERENCES (SAFE NOW) ======
  const loginCard = document.getElementById("loginCard");
  const captureCard = document.getElementById("captureCard");
  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");
  const signInBtn = document.getElementById("signInBtn");
  const loginMsg = document.getElementById("loginMsg");

  const containerInput = document.getElementById("containerInput");
  const photoInput = document.getElementById("photoInput");
  const descInput = document.getElementById("descInput");
  const saveBtn = document.getElementById("saveBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const captureMsg = document.getElementById("captureMsg");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[s]));
  }

  function showLoginError(text) {
    loginMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
  }

  function showSuccess(text) {
    captureMsg.innerHTML = `<div class="success">${escapeHtml(text)}</div>`;
    setTimeout(() => captureMsg.innerHTML = "", 1200);
  }

  async function refreshUI() {
    const { data } = await sb.auth.getSession();
    if (data?.session) {
      loginCard.classList.add("hidden");
      captureCard.classList.remove("hidden");
    } else {
      captureCard.classList.add("hidden");
      loginCard.classList.remove("hidden");
    }
  }

  // ====== EVENTS ======
  signInBtn.addEventListener("click", async () => {
    signInBtn.disabled = true;
    loginMsg.innerHTML = "";

    try {
      const { error } = await sb.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      if (error) throw error;
      await refreshUI();
    } catch (e) {
      showLoginError(e.message);
    } finally {
      signInBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    await refreshUI();
  });

  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;

    try {
      const file = photoInput.files[0];
      if (!file) throw new Error("Photo required");

      const path = `${containerInput.value}/${Date.now()}_${file.name}`;
      const up = await sb.storage.from("item-photos").upload(path, file);
      if (up.error) throw up.error;

      const ins = await sb.from("items").insert({
        container_code: containerInput.value.trim(),
        item_description: descInput.value.trim(),
        photo_path: path
      });
      if (ins.error) throw ins.error;

      descInput.value = "";
      photoInput.value = "";
      showSuccess("Saved ✓");
    } catch (e) {
      captureMsg.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
    } finally {
      saveBtn.disabled = false;
    }
  });

  refreshUI();
});
</script>


</body>
</html>
