<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inventory Capture</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="navigation.js"></script>
<style>
body{font-family:system-ui;background:#eef2f7;color:#17212b;margin:0;padding:20px}
.page{max-width:820px;margin:auto}
.card{background:#ffffff;padding:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.banner{display:none;padding:12px 14px;margin-bottom:12px;border-radius:8px;font-weight:600}
.banner.ok{background:#dff3e4;color:#0b4f1e}
.banner.err{background:#fce2e2;color:#7a1320}
.banner.warn{background:#fff1cc;color:#6a4b00}
label{display:block;margin-top:12px;font-weight:700;color:#1a2430}
input,textarea{width:100%;padding:10px 12px;margin:6px 0;border:1px solid #b8c4d1;border-radius:8px;background:#fff;color:#17212b}
button,.btn{padding:10px 14px;margin-top:12px;border:1px solid #8796a5;border-radius:8px;background:#f8fafc;color:#17212b;cursor:pointer}
button:hover,.btn:hover{background:#eef3f8}
.small{font-size:13px;color:#445262;margin-top:8px}
.viewBtn{margin-left:10px}
#navBar{margin-bottom:14px}
</style>
</head>
<body>
<div class="page">
  <div id="navBar"></div>
  <div class="card">
    <div id="banner" class="banner"></div>
    <h2 style="margin-top:0;color:#17212b">Inventory Capture</h2>

    <label>Container Code</label>
    <input id="containerCode" placeholder="TOTE0001"/>

    <label>Description</label>
    <textarea id="desc" placeholder="Item description"></textarea>

    <label>Photo (optional)</label>
    <input id="photo" type="file" accept="image/*"/>

    <label>Quantity</label>
    <input id="qty" type="number" value="1"/>

    <button id="saveBtn">Save Item</button>
    <button id="viewContainerBtn" class="viewBtn" style="display:none;">View Container</button>

    <div class="small">Provide a description, a photo, or both.</div>
  </div>
</div>

<script>
const sb = getSupabase();
const banner=document.getElementById("banner");
const containerCode=document.getElementById("containerCode");
const descEl=document.getElementById("desc");
const photoEl=document.getElementById("photo");
const qtyEl=document.getElementById("qty");
const saveBtn=document.getElementById("saveBtn");
const viewBtn=document.getElementById("viewContainerBtn");
let lastContainer=null;

function showBanner(type,msg){
  banner.className="banner "+type;
  banner.textContent=msg;
  banner.style.display="block";
  setTimeout(()=>banner.style.display="none",5000);
}
function normalizeContainer(code){ return String(code||"").trim().toUpperCase(); }

async function ensureContainer(code){
  let {data,error}=await sb.from("containers")
    .select("container_code")
    .eq("container_code",code)
    .eq("is_active",true)
    .maybeSingle();
  if(error) throw error;
  if(data) return;
  const { error: insErr } = await sb.from("containers").insert([{container_code:code}]);
  if(insErr) throw insErr;
}

async function saveItem(){
  const container=normalizeContainer(containerCode.value);
  const desc=descEl.value.trim();
  const qty=Number(qtyEl.value||1);
  const photo=photoEl.files[0];

  if(!container){ showBanner("err","Container code required"); return; }
  if(!photo && !desc){ showBanner("err","Add a photo or description"); return; }

  await ensureContainer(container);

  const item_id=crypto.randomUUID();
  let photo_path=null;

  if(photo){
    photo_path=`items/${item_id}.jpg`;
    const {error:uploadErr}=await sb.storage.from("item-photos").upload(photo_path,photo);
    if(uploadErr) throw uploadErr;
  }

  const {error}=await sb.from("items").insert([{
    item_id:item_id,
    ref_uid:item_id,
    container_code:container,
    item_description:desc,
    quantity:qty,
    photo_path:photo_path
  }]);
  if(error) throw error;

  lastContainer=container;
  showBanner("ok","✓ Item saved to "+container);
  viewBtn.style.display="inline-block";
  descEl.value="";
  photoEl.value="";
  qtyEl.value="1";
  descEl.focus();
}

viewBtn.addEventListener("click",()=>{
  if(!lastContainer) return;
  window.location.href="container_detail.html?container_code="+encodeURIComponent(lastContainer);
});

saveBtn.addEventListener("click",()=>saveItem().catch(e=>showBanner("err","Save failed: "+(e.message||e))));

if(window.APP_NAV && APP_NAV.render){ APP_NAV.render("navBar"); }
</script>
</body>
</html>
