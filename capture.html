<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Capture</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    h2 { margin-top: 0; }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
    }
    button {
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 16px;
    }
    .hidden { display: none; }
    .success {
      background: #16a34a;
      color: white;
      padding: 8px;
      margin-top: 12px;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>Inventory Capture</h2>

<div id="login">
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="login()">Sign In</button>
</div>

<div id="capture" class="hidden">
  <input id="container" placeholder="Container Code (e.g. TOTE0076)" />
  <input id="photo" type="file" accept="image/*" capture="environment" />
  <textarea id="desc" placeholder="Item description"></textarea>
  <button onclick="saveItem()">Save Item</button>
  <div id="msg"></div>
</div>

<script>
  // ====== DEBUG: show if JS is running and capture errors ======
  const debugBar = document.createElement("div");
  debugBar.style.cssText = "padding:10px;border-radius:10px;margin:12px 0;font-weight:700;";
  debugBar.textContent = "JS starting…";
  debugBar.style.background = "#f59e0b";
  debugBar.style.color = "#0f172a";
  document.body.insertBefore(debugBar, document.body.firstChild);

  window.addEventListener("error", (e) => {
    debugBar.textContent = "JS ERROR: " + (e?.message || "unknown error");
    debugBar.style.background = "#dc2626";
    debugBar.style.color = "#fff";
  });

  window.addEventListener("unhandledrejection", (e) => {
    debugBar.textContent = "PROMISE ERROR: " + (e?.reason?.message || String(e?.reason));
    debugBar.style.background = "#dc2626";
    debugBar.style.color = "#fff";
  });

  // ====== CONFIG: replace your anon key ======
  const SUPABASE_URL = "https://htmqdzvepyhpklrykjgh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0bXFkenZlcHlocGtscnlramdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NzAzMjEsImV4cCI6MjA4MzA0NjMyMX0.nC_2KfGq6LGUhYjNQTXMFM_7Q_P0MflXEhV_GP1D16M";

  // ====== verify supabase library loaded ======
  if (!window.supabase || !window.supabase.createClient) {
    debugBar.textContent = "Supabase library NOT loaded (cdn blocked or failed).";
    debugBar.style.background = "#dc2626";
    debugBar.style.color = "#fff";
    // Stop here so the page doesn't silently fail
    throw new Error("Supabase JS library missing");
  }

  debugBar.textContent = "JS running ✅  Supabase loaded ✅";
  debugBar.style.background = "#16a34a";
  debugBar.style.color = "#fff";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // DOM refs
  const loginCard = document.getElementById("loginCard");
  const captureCard = document.getElementById("captureCard");
  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");
  const signInBtn = document.getElementById("signInBtn");
  const loginMsg = document.getElementById("loginMsg");

  const containerInput = document.getElementById("containerInput");
  const photoInput = document.getElementById("photoInput");
  const descInput = document.getElementById("descInput");
  const saveBtn = document.getElementById("saveBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const captureMsg = document.getElementById("captureMsg");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[s]));
  }

  function showLoginError(text) {
    loginMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
  }
  function showCaptureMsgSuccess(text) {
    captureMsg.innerHTML = `<div class="success">${escapeHtml(text)}</div>`;
    setTimeout(() => captureMsg.innerHTML = "", 1200);
  }
  function showCaptureMsgError(text) {
    captureMsg.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
  }

  async function refreshUIFromSession() {
    const { data } = await sb.auth.getSession();
    if (data?.session) {
      loginCard.classList.add("hidden");
      captureCard.classList.remove("hidden");
    } else {
      captureCard.classList.add("hidden");
      loginCard.classList.remove("hidden");
    }
  }

  signInBtn.addEventListener("click", async () => {
    loginMsg.innerHTML = "";
    signInBtn.disabled = true;

    try {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showLoginError("Email and password are required.");
        return;
      }

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showLoginError(error.message);
        return;
      }

      await refreshUIFromSession();
    } catch (e) {
      showLoginError(e?.message || String(e));
    } finally {
      signInBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    await refreshUIFromSession();
  });

  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    captureMsg.innerHTML = "";

    try {
      const containerCode = containerInput.value.trim();
      const description = descInput.value.trim();
      const file = photoInput.files?.[0];

      if (!containerCode) throw new Error("Container code is required.");
      if (!file) throw new Error("Photo is required.");
      if (!description) throw new Error("Description is required.");

      const safeName = (file.name || "photo.jpg").replace(/[^\w.\-]/g, "_");
      const filePath = `${containerCode}/${Date.now()}_${safeName}`;

      const { error: uploadError } = await sb.storage
        .from("item-photos")
        .upload(filePath, file, { upsert: false });

      if (uploadError) throw new Error("Upload failed: " + uploadError.message);

      const { error: insertError } = await sb.from("items").insert({
        container_code: containerCode,
        item_description: description,
        photo_path: filePath
      });

      if (insertError) throw new Error("Save failed: " + insertError.message);

      descInput.value = "";
      photoInput.value = "";
      showCaptureMsgSuccess("Saved ✓");
    } catch (e) {
      showCaptureMsgError(e?.message || String(e));
    } finally {
      saveBtn.disabled = false;
    }
  });

  refreshUIFromSession();
</script>

</body>
</html>
