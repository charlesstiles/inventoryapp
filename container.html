<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container Contents</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quagga2 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <!-- Shared config + navigation -->
  <script src="./config.js"></script>
  <script src="./navigation.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.06);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      color: #475569;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30,58,138,0.15);
    }

    button {
      font-weight: 800;
      cursor: pointer;
    }

    .btn {
      background: #1e3a8a;
      color: #fff;
      border: none;
      margin-top: 12px;
    }

    /* ✅ STRONG disabled appearance */
    .btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 1;
    }

    .btn-secondary {
      background: #fff;
      color: #1e3a8a;
      border: 1px solid #1e3a8a;
      margin-top: 12px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .hidden { display: none; }

    .success, .error, .info {
      padding: 10px;
      margin-top: 12px;
      border-radius: 10px;
      font-weight: 800;
      text-align: center;
      color: #fff;
    }

    .success { background: #16a34a; }
    .error { background: #dc2626; }
    .info { background: #0ea5e9; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #f1f5f9;
      font-weight: 800;
    }

    .muted {
      color: #64748b;
      font-size: 12px;
    }

    /* Scanner overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.85);
      display: none;
      z-index: 9999;
      padding: 16px;
    }

    .overlay-inner {
      max-width: 720px;
      margin: auto;
      background: #0b1220;
      border-radius: 16px;
      overflow: hidden;
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
    }

    #scannerArea {
      height: 70vh;
      background: #000;
      position: relative;
    }

    #scannerArea video,
    #scannerArea canvas {
      position: absolute !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }

    .scan-frame {
      position: absolute;
      inset: 30% 10%;
      border: 3px solid rgba(255,255,255,0.85);
      border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>
  <header>
    <h1>Container Contents</h1>
    <div id="navBar"></div>
  </header>

  <!-- Login -->
  <div id="loginCard" class="card">
    <label>Email</label>
    <input id="emailInput" type="email" />

    <label>Password</label>
    <input id="passwordInput" type="password" />

    <button id="signInBtn" class="btn">Sign In</button>
    <div id="loginMsg"></div>
  </div>

  <!-- Main -->
  <div id="mainCard" class="card hidden">
    <label>Container Code</label>
    <input id="containerInput" placeholder="Scan or enter container" />

    <div class="row3">
      <button id="scanBtn" class="btn-secondary">Scan Container</button>
      <button id="loadBtn" class="btn" disabled>Show Contents</button>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>

    <div id="msg"></div>

    <table id="table" class="hidden">
      <thead>
        <tr>
          <th>Description</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Scanner -->
  <div id="scannerOverlay" class="overlay">
    <div class="overlay-inner">
      <div class="overlay-header">
        <div>Scan Container</div>
        <button id="scannerCloseBtn" class="btn-secondary">Close</button>
      </div>
      <div id="scannerArea">
        <div class="scan-frame"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      window.APP_NAV.render("navBar");

      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loginCard = document.getElementById("loginCard");
      const mainCard = document.getElementById("mainCard");
      const containerInput = document.getElementById("containerInput");
      const loadBtn = document.getElementById("loadBtn");
      const table = document.getElementById("table");
      const tbody = table.querySelector("tbody");
      const msg = document.getElementById("msg");

      function updateLoadButtonState() {
        loadBtn.disabled = containerInput.value.trim().length === 0;
      }

      containerInput.addEventListener("input", updateLoadButtonState);
      updateLoadButtonState();

      loadBtn.addEventListener("click", async () => {
        loadBtn.disabled = true;
        msg.innerHTML = "";
        tbody.innerHTML = "";
        table.classList.add("hidden");

        const code = containerInput.value.trim();
        const { data, error } = await sb
          .from("items")
          .select("item_description, created_at")
          .eq("container_code", code)
          .order("created_at", { ascending: false });

        if (error) {
          msg.innerHTML = `<div class="error">${error.message}</div>`;
          updateLoadButtonState();
          return;
        }

        if (!data.length) {
          msg.innerHTML = `<div class="info">No items found.</div>`;
          updateLoadButtonState();
          return;
        }

        data.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.item_description}</td>
            <td class="muted">${new Date(row.created_at).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        });

        table.classList.remove("hidden");
        msg.innerHTML = `<div class="success">${data.length} item(s) loaded.</div>`;
        updateLoadButtonState();
      });
    });
  </script>
</body>
</html>
