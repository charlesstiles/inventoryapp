<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Container</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
</head>
<body>
  <div class="page">
    <div id="navBar"></div>
    <div id="banner" class="banner" style="display:none;"></div>

    <div class="card">
      <h1>Container</h1>

      <label>Container Code</label>
      <input id="containerCode" type="text" placeholder="e.g. TOTE0076" />

      <div class="hr"></div>

      <button class="btn disabled" id="btnShow" disabled>Show Contents</button>
      <div class="small-note">Button enabled when a container code is entered.</div>

      <div class="hr"></div>

      <table class="table" id="tbl" style="display:none;">
        <thead>
          <tr>
            <th></th>
            <th>Description</th>
            <th>Qty</th>
            <th>User</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="small-note" id="note"></div>
    </div>
  </div>

<script>
(function(){
  const banner = document.getElementById("banner");
  const containerCodeEl = document.getElementById("containerCode");
  const btnShow = document.getElementById("btnShow");
  const tbl = document.getElementById("tbl");
  const tbody = document.getElementById("tbody");
  const note = document.getElementById("note");

  function showBanner(type, msg){
    banner.className = "banner " + (type || "ok");
    banner.textContent = msg;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 4500);
  }

  async function requireAuth(){
    await window.APP_NAV.render("navBar");
    const sb = getSupabase();
    const { data } = await sb.auth.getUser();
    if (!data.user){
      window.location.href = "capture.html";
      return null;
    }
    return data.user;
  }

  function updateButtonState(){
    const val = containerCodeEl.value.trim();
    const ok = val.length > 0;
    btnShow.disabled = !ok;
    btnShow.classList.toggle("disabled", !ok);
  }

  containerCodeEl.addEventListener("input", updateButtonState);

  async function signedThumb(path){
    if (!path) return null;
    const sb = getSupabase();
    const { data, error } = await sb.storage.from("item-photos").createSignedUrl(path, 60*30);
    if (error) return null;
    return data?.signedUrl || null;
  }

  function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  btnShow.addEventListener("click", async () => {
    const user = await requireAuth();
    if (!user) return;

    const code = containerCodeEl.value.trim();
    if (!code) return;

    tbody.innerHTML = "";
    tbl.style.display = "none";
    note.textContent = "Loading…";

    try{
      const sb = getSupabase();
      const { data: items, error } = await sb
        .from("items")
        .select("ref_uid, item_description, quantity, created_by, created_at, photo_path")
        .eq("is_active", true)
        .eq("container_code", code)
        .order("created_at", { ascending:false })
        .limit(400);

      if (error) throw error;

      if (!items?.length){
        note.textContent = "No items found.";
        return;
      }

      tbl.style.display = "table";
      note.textContent = `${items.length} item(s).`;

      for (const it of items){
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.addEventListener("click", () => {
          window.location.href = `item_detail.html?ref_uid=${encodeURIComponent(it.ref_uid)}`;
        });

        const thumbUrl = await signedThumb(it.photo_path);
        tr.innerHTML = `
          <td>${thumbUrl ? `<img class="thumb" src="${thumbUrl}" />` : ""}</td>
          <td>${esc(it.item_description)}</td>
          <td class="mono">${esc(String(it.quantity ?? 1))}</td>
          <td class="mono">${esc(it.created_by || "")}</td>
          <td class="mono">${esc(new Date(it.created_at).toLocaleString())}</td>
        `;
        tbody.appendChild(tr);
      }

    }catch(e){
      showBanner("err","Load failed: " + (e.message || e));
      note.textContent = "";
    }
  });

  requireAuth();
  updateButtonState();
})();
</script>
</body>
</html>
