<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Container</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
</head>
<body>
  <div class="page">
    <div id="navBar"></div>
    <div id="banner" class="banner" style="display:none;"></div>

    <div class="card">
      <h1>Container</h1>

      <label>Container Code</label>
      <input id="containerCode" type="text" placeholder="e.g. TOTE0076" />

      <div class="hr"></div>

      <div class="row">
        <button class="btn disabled" id="btnShow" disabled style="max-width:220px;">Show Contents</button>
        <button class="btn secondary" id="btnDetail" style="max-width:220px;">Open Container Detail</button>
      </div>
      <div class="small-note">Show contents for a container, then use the green action buttons to edit items.</div>

      <div class="hr"></div>

      <table class="table" id="tbl" style="display:none;">
        <thead>
          <tr>
            <th></th>
            <th>Description</th>
            <th>Qty</th>
            <th>User</th>
            <th>Created</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="small-note" id="note"></div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn secondary" style="max-width:120px;">Cancel</button>
        <button id="confirmProceed" class="btn" style="max-width:120px;background:linear-gradient(180deg,#dc2626,#b91c1c);">Delete</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const banner = document.getElementById("banner");
  const containerCodeEl = document.getElementById("containerCode");
  const btnShow = document.getElementById("btnShow");
  const btnDetail = document.getElementById("btnDetail");
  const tbl = document.getElementById("tbl");
  const tbody = document.getElementById("tbody");
  const note = document.getElementById("note");
  const confirmOverlay = document.getElementById("confirmOverlay");
  const confirmTitle = document.getElementById("confirmTitle");
  const confirmMessage = document.getElementById("confirmMessage");
  const confirmCancel = document.getElementById("confirmCancel");
  const confirmProceed = document.getElementById("confirmProceed");
  let confirmResolve = null;

  function currentReturnUrl(){
    return window.location.href;
  }
  function itemDetailUrl(refUid){
    return `item_detail.html?ref_uid=${encodeURIComponent(refUid)}&return=${encodeURIComponent(currentReturnUrl())}`;
  }

  confirmCancel.onclick = () => {
    confirmOverlay.style.display = "none";
    if (confirmResolve) confirmResolve(false);
  };
  confirmProceed.onclick = () => {
    confirmOverlay.style.display = "none";
    if (confirmResolve) confirmResolve(true);
  };
  function askConfirm(title, msg){
    confirmTitle.textContent = title;
    confirmMessage.textContent = msg;
    confirmOverlay.style.display = "flex";
    return new Promise(r => confirmResolve = r);
  }

  function showBanner(type, msg){
    banner.className = "banner " + (type || "ok");
    banner.textContent = msg;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 4500);
  }

  async function requireAuth(){
    await window.APP_NAV.render("navBar");
    const sb = getSupabase();
    const { data } = await sb.auth.getUser();
    if (!data.user){
      window.location.href = "index.html";
      return null;
    }
    return data.user;
  }

  function updateButtonState(){
    const val = containerCodeEl.value.trim();
    const ok = val.length > 0;
    btnShow.disabled = !ok;
    btnShow.classList.toggle("disabled", !ok);
  }

  containerCodeEl.addEventListener("input", updateButtonState);

  btnDetail.addEventListener("click", () => {
    const code = containerCodeEl.value.trim();
    if (!code) return;
    window.location.href = `container_detail.html?container_code=${encodeURIComponent(code)}&return=${encodeURIComponent(currentReturnUrl())}`;
  });

  async function signedThumb(path){
    if (!path) return null;
    const sb = getSupabase();
    const { data, error } = await sb.storage.from("item-photos").createSignedUrl(path, 60*30);
    if (error) return null;
    return data?.signedUrl || null;
  }

  function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  async function deleteItem(item){
    const ok = await askConfirm("Delete item?", (item.item_description || "(no description)") + " from " + item.container_code);
    if (!ok) return;
    const sb = getSupabase();
    const { error } = await sb.from("items").update({ is_active:false }).eq("ref_uid", item.ref_uid);
    if (error) throw error;
    showBanner("ok", "Item deleted.");
    btnShow.click();
  }

  btnShow.addEventListener("click", async () => {
    const user = await requireAuth();
    if (!user) return;

    const code = containerCodeEl.value.trim();
    if (!code) return;

    tbody.innerHTML = "";
    tbl.style.display = "none";
    note.textContent = "Loading…";

    try{
      const sb = getSupabase();
      const { data: items, error } = await sb
        .from("items")
        .select("ref_uid, item_description, quantity, created_by, created_at, photo_path, container_code")
        .eq("is_active", true)
        .eq("container_code", code)
        .order("created_at", { ascending:false })
        .limit(400);

      if (error) throw error;

      if (!items?.length){
        note.textContent = "No items found.";
        return;
      }

      tbl.style.display = "table";
      note.textContent = `${items.length} item(s).`;

      for (const it of items){
        const tr = document.createElement("tr");
        const thumbUrl = await signedThumb(it.photo_path);
        tr.innerHTML = `
          <td>${thumbUrl ? `<img class="thumb" src="${thumbUrl}" />` : ""}</td>
          <td>${esc(it.item_description)}</td>
          <td class="mono">${esc(String(it.quantity ?? 1))}</td>
          <td class="mono">${esc(it.created_by || "")}</td>
          <td class="mono">${esc(new Date(it.created_at).toLocaleString())}</td>
          <td class="no-print">
            <div class="action-stack">
              <a class="icon-circle icon-edit" href="${itemDetailUrl(it.ref_uid)}" title="Edit item">✎</a>
              <button class="icon-circle icon-delete" data-del-item="${esc(it.ref_uid)}" title="Delete item">✕</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);

        tr.querySelector('[data-del-item="' + it.ref_uid + '"]').addEventListener("click", () => {
          deleteItem(it).catch(e => showBanner("err", "Delete failed: " + (e.message || e)));
        });
      }

    }catch(e){
      showBanner("err","Load failed: " + (e.message || e));
      note.textContent = "";
    }
  });

  requireAuth();
  updateButtonState();
})();
</script>
</body>
</html>
