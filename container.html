<!-- =========================
     container.html (FULL FILE)
     =========================
     - Requires login before showing container UI
     - Sets window.APP_SUPABASE
     - Nav hides Search/Container when logged out
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container Contents</title>

  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <script src="./config.js"></script>
  <script src="./navigation.js"></script>
</head>

<body>
  <header>
    <h1>Container Contents</h1>
    <div id="navBar"></div>
  </header>

  <!-- Login -->
  <div id="loginCard" class="card">
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" />

    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />

    <button id="signInBtn" class="btn" type="button">Sign In</button>
    <div id="loginMsg"></div>
  </div>

  <!-- Main -->
  <div id="mainCard" class="card hidden">
    <label for="containerInput">Container Code</label>
    <input id="containerInput" placeholder="Scan or enter container code" />

    <div class="row3">
      <button id="scanBtn" class="btn-secondary" type="button">Scan Container</button>
      <button id="showBtn" class="btn" type="button" disabled>Show Contents</button>
      <div></div>
    </div>

    <div id="msg"></div>

    <table id="table" class="table hidden">
      <thead>
        <tr>
          <th style="width:70px;">Photo</th>
          <th>Description</th>
          <th style="width:170px;">Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Photo modal -->
  <div id="photoModal" class="modal" aria-hidden="true">
    <div class="modal-inner">
      <div class="modal-header">
        <div>
          <div id="modalTitle">Photo</div>
          <div id="modalMeta" class="meta"></div>
        </div>
        <button id="modalCloseBtn" class="btn-secondary" type="button">Close</button>
      </div>
      <div class="modal-body">
        <img id="modalImg" alt="Item photo preview" />
      </div>
    </div>
  </div>

  <!-- Scanner overlay -->
  <div id="scannerOverlay" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="overlay-header">
        <div>Scan Code 39 Container Label</div>
        <button id="scannerCloseBtn" class="btn-secondary" type="button">Close</button>
      </div>

      <div id="scannerArea">
        <div class="scan-guide"><div class="scan-frame"></div></div>
      </div>

      <div class="overlay-footer">
        Hold barcode inside the frame. It will auto-fill the container code.
        <div style="margin-top:8px;">Last scan: <span id="lastScan" class="mono">—</span></div>
        <div id="scanErr" style="margin-top:8px;color:#fca5a5;font-weight:900;"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Missing config.js settings.");
        return;
      }
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      window.APP_SUPABASE = sb;

      if (window.APP_NAV) await window.APP_NAV.render("navBar");

      const BUCKET = "item-photos";
      const signedUrlCache = new Map();

      const loginCard = document.getElementById("loginCard");
      const mainCard = document.getElementById("mainCard");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const signInBtn = document.getElementById("signInBtn");
      const loginMsg = document.getElementById("loginMsg");

      const containerInput = document.getElementById("containerInput");
      const scanBtn = document.getElementById("scanBtn");
      const showBtn = document.getElementById("showBtn");

      const msg = document.getElementById("msg");
      const table = document.getElementById("table");
      const tbody = table.querySelector("tbody");

      const photoModal = document.getElementById("photoModal");
      const modalCloseBtn = document.getElementById("modalCloseBtn");
      const modalImg = document.getElementById("modalImg");
      const modalTitle = document.getElementById("modalTitle");
      const modalMeta = document.getElementById("modalMeta");

      const scannerOverlay = document.getElementById("scannerOverlay");
      const scannerCloseBtn = document.getElementById("scannerCloseBtn");
      const lastScan = document.getElementById("lastScan");
      const scanErr = document.getElementById("scanErr");

      const escapeHtml = (str) =>
        String(str).replace(/[&<>"']/g, s => ({
          "&":"&amp;","<":"&lt;",">":"&gt;", "\"":"&quot;","'":"&#39;"
        }[s]));

      function show(type, text) {
        msg.innerHTML = `<div class="${type}">${escapeHtml(text)}</div>`;
      }

      function clearResults() {
        tbody.innerHTML = "";
        table.classList.add("hidden");
      }

      function updateShowButtonState() {
        showBtn.disabled = containerInput.value.trim().length === 0;
      }

      async function refreshUI() {
        const { data } = await sb.auth.getSession();
        const authed = !!data?.session;

        if (authed) {
          loginCard.classList.add("hidden");
          mainCard.classList.remove("hidden");
          emailInput.value = "";
          passwordInput.value = "";
          loginMsg.innerHTML = "";
          containerInput.focus();
        } else {
          mainCard.classList.add("hidden");
          loginCard.classList.remove("hidden");
          msg.innerHTML = "";
          clearResults();
          containerInput.value = "";
          updateShowButtonState();
          emailInput.focus();
        }

        if (window.APP_NAV) await window.APP_NAV.render("navBar");
      }

      // Auth
      signInBtn.addEventListener("click", async () => {
        signInBtn.disabled = true;
        loginMsg.innerHTML = "";
        try {
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          if (!email || !password) {
            loginMsg.innerHTML = `<div class="error">Email and password are required.</div>`;
            return;
          }
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            loginMsg.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
            return;
          }
          await refreshUI();
        } finally {
          signInBtn.disabled = false;
        }
      });

      containerInput.addEventListener("input", updateShowButtonState);
      containerInput.addEventListener("change", updateShowButtonState);
      updateShowButtonState();

      containerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !showBtn.disabled) showBtn.click();
      });

      async function getSignedUrl(photoPath) {
        if (!photoPath) return null;
        if (signedUrlCache.has(photoPath)) return signedUrlCache.get(photoPath);

        const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(photoPath, 60 * 60);
        if (error) return null;

        signedUrlCache.set(photoPath, data.signedUrl);
        return data.signedUrl;
      }

      async function preSignBatch(photoPaths, batchSize = 25) {
        const needed = photoPaths.filter(p => p && !signedUrlCache.has(p));
        for (let i = 0; i < needed.length; i += batchSize) {
          const slice = needed.slice(i, i + batchSize);
          await Promise.all(slice.map(p => getSignedUrl(p)));
          await new Promise(r => setTimeout(r, 0));
        }
      }

      function openModal({ title, meta, imgUrl }) {
        modalTitle.textContent = title || "Photo";
        modalMeta.textContent = meta || "";
        modalImg.src = imgUrl || "";
        photoModal.style.display = "block";
        photoModal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        photoModal.style.display = "none";
        photoModal.setAttribute("aria-hidden", "true");
        modalImg.src = "";
      }

      modalCloseBtn.addEventListener("click", closeModal);
      photoModal.addEventListener("click", (e) => { if (e.target === photoModal) closeModal(); });

      let thumbObserver = null;
      function ensureThumbObserver() {
        if (thumbObserver) return;
        thumbObserver = new IntersectionObserver(async (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;

            const img = entry.target;
            const path = img.getAttribute("data-photo-path");
            if (!path) { thumbObserver.unobserve(img); continue; }
            if (img.getAttribute("data-loaded") === "1") { thumbObserver.unobserve(img); continue; }

            const url = signedUrlCache.get(path) || await getSignedUrl(path);
            if (url) {
              img.src = url;
              img.onload = () => img.classList.add("loaded");
              img.onerror = () => img.classList.add("loaded");
            }
            img.setAttribute("data-loaded", "1");

            const wrap = img.closest(".thumbWrap");
            if (wrap) wrap.classList.remove("shimmer");

            thumbObserver.unobserve(img);
          }
        }, { root: null, rootMargin: "250px", threshold: 0.01 });
      }

      // Show contents
      showBtn.addEventListener("click", async () => {
        showBtn.disabled = true;
        msg.innerHTML = "";
        clearResults();

        const code = containerInput.value.trim();
        if (!code) { show("error", "Enter or scan a container code."); updateShowButtonState(); return; }

        try {
          show("info", "Loading items…");
          const { data, error } = await sb
            .from("items")
            .select("item_description, created_at, photo_path")
            .eq("container_code", code)
            .order("created_at", { ascending: false })
            .limit(500);

          if (error) { show("error", error.message); return; }
          if (!data || data.length === 0) { show("info", `No items found in ${code}.`); return; }

          const paths = data.map(r => r.photo_path).filter(Boolean);
          ensureThumbObserver();

          for (const row of data) {
            const tr = document.createElement("tr");
            tr.className = "clickable";

            const tdPhoto = document.createElement("td");
            const tdDesc = document.createElement("td");
            const tdCreated = document.createElement("td");

            tdDesc.textContent = row.item_description || "";
            tdCreated.className = "muted";
            tdCreated.textContent = new Date(row.created_at).toLocaleString();

            const photoPath = row.photo_path || "";

            if (photoPath) {
              const wrap = document.createElement("div");
              wrap.className = "thumbWrap shimmer";

              const img = document.createElement("img");
              img.className = "thumb";
              img.alt = "Item photo";
              img.setAttribute("data-photo-path", photoPath);
              img.setAttribute("data-loaded", "0");

              wrap.appendChild(img);
              tdPhoto.appendChild(wrap);
              thumbObserver.observe(img);
            } else {
              tdPhoto.textContent = "—";
              tdPhoto.className = "muted";
            }

            tr.addEventListener("click", async () => {
              if (!photoPath) return;
              const fullUrl = signedUrlCache.get(photoPath) || await getSignedUrl(photoPath);
              openModal({
                title: row.item_description || "Item Photo",
                meta: `Container: ${code} • ${new Date(row.created_at).toLocaleString()}`,
                imgUrl: fullUrl || ""
              });
            });

            tr.appendChild(tdPhoto);
            tr.appendChild(tdDesc);
            tr.appendChild(tdCreated);
            tbody.appendChild(tr);
          }

          table.classList.remove("hidden");
          show("success", `${data.length} item(s) loaded for ${code}. Thumbnails load as you scroll.`);
          setTimeout(() => { preSignBatch(paths, 25); }, 0);

        } catch (e) {
          show("error", e?.message || String(e));
        } finally {
          updateShowButtonState();
        }
      });

      // Scanner
      let scannerRunning = false;
      let lastDetectedAt = 0;
      let didDecode = false;

      scanBtn.addEventListener("click", () => openScanner());
      scannerCloseBtn.addEventListener("click", () => closeScanner());
      scannerOverlay.addEventListener("click", (e) => { if (e.target === scannerOverlay) closeScanner(); });

      function decodeCode39FullASCII(s) {
        return String(s || "").replace(/\+([A-Z])/g, (_, ch) => ch.toLowerCase());
      }
      function normalizeCode39(value) {
        const raw = String(value || "").trim().replace(/^\*+|\*+$/g, "");
        return decodeCode39FullASCII(raw);
      }
      function getCameraConstraints() {
        return {
          facingMode: { ideal: "environment" },
          aspectRatio: { ideal: 4 / 3 },
          width:  { ideal: 1280 },
          height: { ideal: 960 }
        };
      }
      async function forceMinZoomIfSupported() {
        try {
          const ca = Quagga.CameraAccess;
          const track = (ca && typeof ca.getActiveTrack === "function") ? ca.getActiveTrack() : null;
          if (!track) return;
          const caps = track.getCapabilities ? track.getCapabilities() : null;
          if (!caps || !caps.zoom) return;
          const minZoom = (caps.zoom.min != null) ? caps.zoom.min : 1;
          await track.applyConstraints({ advanced: [{ zoom: minZoom }] });
        } catch (_) {}
      }

      function openScanner() {
        scanErr.textContent = "";
        lastScan.textContent = "Scanning…";
        didDecode = false;
        scannerOverlay.style.display = "block";
        scannerOverlay.setAttribute("aria-hidden", "false");
        startScanner();
      }
      async function closeScanner() {
        await stopScannerIfRunning();
        scannerOverlay.style.display = "none";
        scannerOverlay.setAttribute("aria-hidden", "true");
      }

      function startScanner() {
        if (scannerRunning) return;

        const config = {
          inputStream: {
            type: "LiveStream",
            target: document.querySelector("#scannerArea"),
            constraints: getCameraConstraints()
          },
          locator: { patchSize: "x-large", halfSample: false },
          numOfWorkers: 0,
          frequency: 10,
          decoder: { readers: ["code_39_reader"] },
          locate: true,
          area: { top: "20%", right: "5%", left: "5%", bottom: "20%" }
        };

        Quagga.init(config, (err) => {
          if (err) {
            scanErr.textContent = "Scanner init failed: " + (err.message || String(err));
            return;
          }
          Quagga.start();
          scannerRunning = true;
          setTimeout(() => { forceMinZoomIfSupported(); }, 250);
        });

        Quagga.onDetected(onDetected);

        setTimeout(() => {
          if (scannerRunning && !didDecode) {
            scanErr.textContent =
              "No decode yet. Move closer, center barcode, tilt to reduce glare, or increase label size.";
          }
        }, 7000);
      }

      async function stopScannerIfRunning() {
        if (!scannerRunning) return;
        try {
          Quagga.offDetected(onDetected);
          Quagga.stop();
        } catch (_) {}
        scannerRunning = false;
      }

      async function onDetected(result) {
        const now = Date.now();
        if (now - lastDetectedAt < 900) return;
        lastDetectedAt = now;

        const code = normalizeCode39(result?.codeResult?.code);
        if (!code) return;

        didDecode = true;
        lastScan.textContent = code;
        containerInput.value = code;
        updateShowButtonState();

        await closeScanner();
        show("info", "Container set: " + code);
      }

      await refreshUI();
    });
  </script>
</body>
</html>
