<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container Contents</title>

  <!-- Supabase JS (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quagga2 for Code 39 scanning -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <!-- Shared config + navigation -->
  <script src="./config.js"></script>
  <script src="./navigation.js"></script>

  <style>
    /* --- Navigation (responsive) --- */
#navBar { display: flex; justify-content: flex-end; }

.navWrap { position: relative; display: flex; align-items: center; gap: 10px; }

/* Desktop inline links */
.navInline { display: flex; gap: 10px; align-items: center; }

/* Hamburger button (mobile) */
.navBurger {
  display: none;            /* hidden on desktop */
  width: auto;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #1e3a8a;
  background: #fff;
  color: #1e3a8a;
  font-weight: 900;
  cursor: pointer;
}

/* Links (small, consistent) */
.navLink {
  display: inline-block;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #1e3a8a;
  background: #fff;
  color: #1e3a8a;
  text-decoration: none;
  font-weight: 900;
  font-size: 14px;
  line-height: 1;
}

.navLink.active {
  background: #1e3a8a;
  color: #fff;
}

/* Dropdown menu (mobile) */
.navMenu {
  position: absolute;
  top: 44px;
  right: 0;
  min-width: 160px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 10px 20px rgba(15,23,42,0.18);
  padding: 8px;
  display: grid;
  gap: 8px;
  z-index: 2000;
}

/* Utility */
.hidden { display: none !important; }

/* Responsive breakpoint */
@media (max-width: 520px) {
  .navInline { display: none; }   /* hide inline on mobile */
  .navBurger { display: inline-block; } /* show hamburger */
  .navLink { width: 100%; }       /* menu links fill */
}

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 { font-size: 20px; margin: 0; }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.06);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      color: #475569;
      font-size: 14px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
      outline: none;
    }

    input:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30,58,138,0.15);
    }

    button {
      font-weight: 800;
      cursor: pointer;
    }

    .btn {
      background: #1e3a8a;
      color: #fff;
      border: none;
      margin-top: 12px;
    }

    /* Strong disabled appearance */
    .btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 1;
    }

    .btn-secondary {
      background: #fff;
      color: #1e3a8a;
      border: 1px solid #1e3a8a;
      margin-top: 12px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .hidden { display: none; }

    .success, .error, .info {
      padding: 10px;
      margin-top: 12px;
      border-radius: 10px;
      font-weight: 800;
      text-align: center;
      color: #fff;
    }
    .success { background: #16a34a; }
    .error { background: #dc2626; }
    .info { background: #0ea5e9; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
      font-weight: 900;
    }

    tr:hover { background: #f8fafc; }

    .muted { color: #64748b; font-size: 12px; }

    /* Thumbnail */
    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      background: #f1f5f9;
    }

    /* Photo modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.86);
      display: none;
      z-index: 10000;
      padding: 14px;
      box-sizing: border-box;
    }

    .modal-inner {
      max-width: 900px;
      margin: 0 auto;
      background: #0b1220;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(226,232,240,0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      background: #0f172a;
      color: #fff;
      font-weight: 900;
    }

    .modal-header .meta {
      font-weight: 800;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .modal-header button {
      width: auto;
      margin-top: 0;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .modal-body {
      background: #000;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .modal-body img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      background: #000;
    }

    /* Scanner overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      z-index: 9999;
      padding: 16px;
      box-sizing: border-box;
    }

    .overlay-inner {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #0b1220;
      border: 1px solid rgba(226,232,240,0.2);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #0f172a;
      color: #fff;
      font-weight: 900;
    }

    .overlay-header button {
      width: auto;
      margin-top: 0;
      padding: 10px 12px;
      border-radius: 10px;
    }

    /* Stable preview + contain to avoid crop */
    #scannerArea {
      position: relative;
      width: 100%;
      height: 70vh;
      background: #000;
      overflow: hidden;
    }
    #scannerArea video,
    #scannerArea canvas {
      position: absolute !important;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }

    .scan-guide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .scan-frame {
      width: 80%;
      height: 35%;
      border: 3px solid rgba(255,255,255,0.85);
      border-radius: 14px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.25);
    }

    .overlay-footer {
      padding: 12px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.35;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <header>
    <h1>Container Contents</h1>
    <div id="navBar"></div>
  </header>

  <!-- Login -->
  <div id="loginCard" class="card">
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" />

    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />

    <button id="signInBtn" class="btn" type="button">Sign In</button>
    <div id="loginMsg"></div>
  </div>

  <!-- Main -->
  <div id="mainCard" class="card hidden">
    <label for="containerInput">Container Code</label>
    <input id="containerInput" placeholder="Scan or enter container code" />

    <div class="row3">
      <button id="scanBtn" class="btn-secondary" type="button">Scan Container</button>
      <button id="showBtn" class="btn" type="button" disabled>Show Contents</button>
      <button id="logoutBtn" class="btn-secondary" type="button">Logout</button>
    </div>

    <div id="msg"></div>

    <table id="table" class="hidden">
      <thead>
        <tr>
          <th style="width:70px;">Photo</th>
          <th>Description</th>
          <th style="width:170px;">Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Photo modal -->
  <div id="photoModal" class="modal" aria-hidden="true">
    <div class="modal-inner">
      <div class="modal-header">
        <div>
          <div id="modalTitle">Photo</div>
          <div id="modalMeta" class="meta"></div>
        </div>
        <button id="modalCloseBtn" class="btn-secondary" type="button">Close</button>
      </div>
      <div class="modal-body">
        <img id="modalImg" alt="Item photo preview" />
      </div>
    </div>
  </div>

  <!-- Scanner overlay -->
  <div id="scannerOverlay" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="overlay-header">
        <div>Scan Code 39 Container Label</div>
        <button id="scannerCloseBtn" class="btn-secondary" type="button">Close</button>
      </div>

      <div id="scannerArea">
        <div class="scan-guide">
          <div class="scan-frame"></div>
        </div>
      </div>

      <div class="overlay-footer">
        Hold the barcode inside the frame. When detected, it will fill the container code.
        <div style="margin-top:8px;">Last scan: <span id="lastScan" class="mono">—</span></div>
        <div id="scanErr" style="margin-top:8px;color:#fca5a5;font-weight:900;"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Nav
      if (window.APP_NAV) window.APP_NAV.render("navBar");

      // Config
      if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_ANON_KEY) {
        alert("Missing config.js or SUPABASE settings.");
        return;
      }
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // DOM
      const loginCard = document.getElementById("loginCard");
      const mainCard = document.getElementById("mainCard");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const signInBtn = document.getElementById("signInBtn");
      const loginMsg = document.getElementById("loginMsg");

      const containerInput = document.getElementById("containerInput");
      const scanBtn = document.getElementById("scanBtn");
      const showBtn = document.getElementById("showBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      const msg = document.getElementById("msg");
      const table = document.getElementById("table");
      const tbody = table.querySelector("tbody");

      const scannerOverlay = document.getElementById("scannerOverlay");
      const scannerCloseBtn = document.getElementById("scannerCloseBtn");
      const lastScan = document.getElementById("lastScan");
      const scanErr = document.getElementById("scanErr");

      const photoModal = document.getElementById("photoModal");
      const modalCloseBtn = document.getElementById("modalCloseBtn");
      const modalImg = document.getElementById("modalImg");
      const modalTitle = document.getElementById("modalTitle");
      const modalMeta = document.getElementById("modalMeta");

      const BUCKET = "item-photos";
      const signedUrlCache = new Map(); // photo_path -> signedUrl

      const escapeHtml = (str) =>
        String(str).replace(/[&<>"']/g, s => ({
          "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
        }[s]));

      function show(type, text) {
        msg.innerHTML = `<div class="${type}">${escapeHtml(text)}</div>`;
      }

      function clearResults() {
        tbody.innerHTML = "";
        table.classList.add("hidden");
      }

      function updateShowButtonState() {
        showBtn.disabled = containerInput.value.trim().length === 0;
      }

      async function refreshUI() {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          loginCard.classList.add("hidden");
          mainCard.classList.remove("hidden");
          containerInput.focus();
        } else {
          mainCard.classList.add("hidden");
          loginCard.classList.remove("hidden");
          emailInput.focus();
        }
      }

      // --- Auth ---
      signInBtn.addEventListener("click", async () => {
        signInBtn.disabled = true;
        loginMsg.innerHTML = "";
        try {
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          if (!email || !password) {
            loginMsg.innerHTML = `<div class="error">Email and password are required.</div>`;
            return;
          }
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            loginMsg.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
            return;
          }
          await refreshUI();
        } finally {
          signInBtn.disabled = false;
        }
      });

      logoutBtn.addEventListener("click", async () => {
        await stopScannerIfRunning();
        await sb.auth.signOut();
        msg.innerHTML = "";
        clearResults();
        containerInput.value = "";
        updateShowButtonState();
        await refreshUI();
      });

      // --- Enable/disable Show button ---
      containerInput.addEventListener("input", updateShowButtonState);
      containerInput.addEventListener("change", updateShowButtonState);
      updateShowButtonState();

      // Enter to show
      containerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !showBtn.disabled) showBtn.click();
      });

      // --- Signed URL helper ---
      async function getSignedUrl(photoPath) {
        if (!photoPath) return null;
        if (signedUrlCache.has(photoPath)) return signedUrlCache.get(photoPath);

        // 1 hour signed url
        const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(photoPath, 60 * 60);
        if (error) return null;

        signedUrlCache.set(photoPath, data.signedUrl);
        return data.signedUrl;
      }

      // --- Modal ---
      function openModal({ title, meta, imgUrl }) {
        modalTitle.textContent = title || "Photo";
        modalMeta.textContent = meta || "";
        modalImg.src = imgUrl || "";
        photoModal.style.display = "block";
        photoModal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        photoModal.style.display = "none";
        photoModal.setAttribute("aria-hidden", "true");
        modalImg.src = "";
      }

      modalCloseBtn.addEventListener("click", closeModal);
      photoModal.addEventListener("click", (e) => {
        if (e.target === photoModal) closeModal();
      });

      // --- Show contents ---
      showBtn.addEventListener("click", async () => {
        showBtn.disabled = true;
        msg.innerHTML = "";
        clearResults();

        try {
          const code = containerInput.value.trim();
          if (!code) { show("error", "Enter or scan a container code."); return; }

          // Pull photo_path so we can preview
          const { data, error } = await sb
            .from("items")
            .select("item_description, created_at, photo_path")
            .eq("container_code", code)
            .order("created_at", { ascending: false })
            .limit(200);

          if (error) { show("error", error.message); return; }

          if (!data || data.length === 0) {
            show("info", `No items found in ${code}.`);
            return;
          }

          // Render rows; thumbnail uses signed URL
          for (const row of data) {
            const tr = document.createElement("tr");

            const tdPhoto = document.createElement("td");
            const tdDesc = document.createElement("td");
            const tdCreated = document.createElement("td");

            // Description / created
            tdDesc.textContent = row.item_description || "";
            tdCreated.className = "muted";
            tdCreated.textContent = new Date(row.created_at).toLocaleString();

            // Thumbnail
            if (row.photo_path) {
              const img = document.createElement("img");
              img.className = "thumb";
              img.alt = "Item photo";

              // Load signed URL for thumb
              const thumbUrl = await getSignedUrl(row.photo_path);
              if (thumbUrl) img.src = thumbUrl;

              img.addEventListener("click", async () => {
                // Reuse cached signed URL (or refresh if missing)
                const fullUrl = signedUrlCache.get(row.photo_path) || await getSignedUrl(row.photo_path);
                openModal({
                  title: row.item_description || "Item Photo",
                  meta: `Container: ${code} • ${new Date(row.created_at).toLocaleString()}`,
                  imgUrl: fullUrl || ""
                });
              });

              tdPhoto.appendChild(img);
            } else {
              tdPhoto.textContent = "—";
              tdPhoto.className = "muted";
            }

            tr.appendChild(tdPhoto);
            tr.appendChild(tdDesc);
            tr.appendChild(tdCreated);
            tbody.appendChild(tr);
          }

          table.classList.remove("hidden");
          show("success", `${data.length} item(s) loaded for ${code}. Tap a thumbnail to view.`);
        } catch (e) {
          show("error", e?.message || String(e));
        } finally {
          updateShowButtonState();
        }
      });

      // ----------------------------
      // Scanner (Code 39) - stable preview + Full ASCII lowercase decode
      // ----------------------------
      let scannerRunning = false;
      let lastDetectedAt = 0;
      let didDecode = false;

      function decodeCode39FullASCII(s) {
        // +A..+Z => a..z
        return String(s || "").replace(/\+([A-Z])/g, (_, ch) => ch.toLowerCase());
      }

      function normalizeCode39(value) {
        const raw = String(value || "").trim().replace(/^\*+|\*+$/g, "");
        return decodeCode39FullASCII(raw);
      }

      function getCameraConstraints() {
        return {
          facingMode: { ideal: "environment" },
          aspectRatio: { ideal: 4 / 3 },
          width:  { ideal: 1280 },
          height: { ideal: 960 }
        };
      }

      async function forceMinZoomIfSupported() {
        try {
          const ca = Quagga.CameraAccess;
          const track = (ca && typeof ca.getActiveTrack === "function") ? ca.getActiveTrack() : null;
          if (!track) return;
          const caps = track.getCapabilities ? track.getCapabilities() : null;
          if (!caps || !caps.zoom) return;
          const minZoom = (caps.zoom.min != null) ? caps.zoom.min : 1;
          await track.applyConstraints({ advanced: [{ zoom: minZoom }] });
        } catch (_) {}
      }

      function openScanner() {
        scanErr.textContent = "";
        lastScan.textContent = "Scanning…";
        didDecode = false;

        scannerOverlay.style.display = "block";
        scannerOverlay.setAttribute("aria-hidden", "false");
        startScanner();
      }

      async function closeScanner() {
        await stopScannerIfRunning();
        scannerOverlay.style.display = "none";
        scannerOverlay.setAttribute("aria-hidden", "true");
      }

      scannerCloseBtn.addEventListener("click", closeScanner);
      scannerOverlay.addEventListener("click", (e) => {
        if (e.target === scannerOverlay) closeScanner();
      });

      scanBtn.addEventListener("click", () => openScanner());

      function startScanner() {
        if (scannerRunning) return;

        scanErr.textContent = "";
        lastScan.textContent = "Scanning…";

        const config = {
          inputStream: {
            type: "LiveStream",
            target: document.querySelector("#scannerArea"),
            constraints: getCameraConstraints()
          },
          locator: { patchSize: "x-large", halfSample: false },
          numOfWorkers: 0,
          frequency: 10,
          decoder: { readers: ["code_39_reader"] },
          locate: true,
          area: { top: "20%", right: "5%", left: "5%", bottom: "20%" }
        };

        Quagga.init(config, (err) => {
          if (err) {
            scanErr.textContent = "Scanner init failed: " + (err.message || String(err));
            return;
          }
          Quagga.start();
          scannerRunning = true;
          setTimeout(() => { forceMinZoomIfSupported(); }, 250);
        });

        Quagga.onProcessed((result) => {
          if (!scannerRunning || didDecode) return;
          const hasCandidates = !!(result && result.boxes && result.boxes.length);
          lastScan.textContent = hasCandidates ? "Scanning… (candidate detected)" : "Scanning…";
          if (hasCandidates) scanErr.textContent = "";
        });

        Quagga.onDetected(onDetected);

        setTimeout(() => {
          if (scannerRunning && !didDecode) {
            scanErr.textContent =
              "No decode yet. Move closer, center barcode, tilt to reduce glare, or increase label size.";
          }
        }, 7000);
      }

      async function stopScannerIfRunning() {
        if (!scannerRunning) return;
        try {
          Quagga.offDetected(onDetected);
          Quagga.offProcessed();
          Quagga.stop();
        } catch (_) {}
        scannerRunning = false;
      }

      async function onDetected(result) {
        const now = Date.now();
        if (now - lastDetectedAt < 900) return;
        lastDetectedAt = now;

        const code = normalizeCode39(result?.codeResult?.code);
        if (!code) return;

        didDecode = true;
        lastScan.textContent = code;
        containerInput.value = code;
        updateShowButtonState();

        await closeScanner();
        show("info", "Container set: " + code);
      }

      // Init
      refreshUI();
    });
  </script>
</body>
</html>
