<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inventory Report</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="navigation.js"></script>
<style>
  .cancel-strong{
    border:1px solid #64748b !important;
    color:#0f172a !important;
    background:#e2e8f0 !important;
  }
  .cancel-strong:hover{
    background:#cbd5e1 !important;
  }
  .item-action-stack{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .icon-item{
    width:28px;
    height:28px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    cursor:pointer;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    color:#334155;
    font-size:13px;
    font-weight:900;
  }
  .icon-item:hover{
    background:#eef2f7;
    text-decoration:none;
  }
  .icon-item-delete{
    color:#991b1b;
    border-color:#fecaca;
    background:#fff5f5;
  }
  .icon-item-delete:hover{
    background:#fee2e2;
  }
  .row-deleting td{
    opacity:.55;
    transition:opacity .15s ease;
  }
  .row-deleting .item-desc{
    text-decoration:line-through;
  }
  .row-deleting .icon-item,
  .row-deleting .icon-circle{
    pointer-events:none;
    opacity:.5;
  }
</style>
</head>
<body>
<div class="page">
  <div id="navBar"></div>
  <div id="banner" class="banner" style="display:none;"></div>

  <div class="card">
    <h1>Inventory Report</h1>

    <div class="toolbar-panel no-print">
      <div>
        <label>Filter</label>
        <input id="q" placeholder="container code or item description">
      </div>
      <div>
        <label>Sort Containers</label>
        <select id="sortBy">
          <option value="code">Container Code</option>
          <option value="recent">Most Recent Item</option>
        </select>
      </div>
      <div>
        <label>Show</label>
        <select id="thumbMode">
          <option value="thumb">Thumbnails</option>
          <option value="none">No Thumbnails</option>
        </select>
      </div>
      <div class="spacer"></div>
      <div>
        <label>&nbsp;</label>
        <button id="btnExpandAll" class="btn secondary" style="max-width:140px;">Expand All</button>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="btnCollapseAll" class="btn secondary" style="max-width:140px;">Collapse All</button>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="btnRefresh" class="btn secondary" style="max-width:120px;">Refresh</button>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="btnPrint" class="btn secondary" style="max-width:120px;">Print</button>
      </div>
    </div>

    <div id="summary" class="small-note" style="margin:12px 0 4px;"></div>
    <div id="reportRoot"></div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button id="confirmCancel" class="btn secondary cancel-strong" style="max-width:120px;">Cancel</button>
      <button id="confirmProceed" class="btn" style="max-width:120px;background:linear-gradient(180deg,#dc2626,#b91c1c);">Delete</button>
    </div>
  </div>
</div>

<script>
const sb = getSupabase();
const qEl = document.getElementById("q");
const sortByEl = document.getElementById("sortBy");
const thumbModeEl = document.getElementById("thumbMode");
const reportRoot = document.getElementById("reportRoot");
const summary = document.getElementById("summary");
const banner = document.getElementById("banner");
const btnExpandAll = document.getElementById("btnExpandAll");
const btnCollapseAll = document.getElementById("btnCollapseAll");
const btnRefresh = document.getElementById("btnRefresh");
const btnPrint = document.getElementById("btnPrint");
const confirmOverlay = document.getElementById("confirmOverlay");
const confirmTitle = document.getElementById("confirmTitle");
const confirmMessage = document.getElementById("confirmMessage");
const confirmCancel = document.getElementById("confirmCancel");
const confirmProceed = document.getElementById("confirmProceed");
let confirmResolve = null;
let state = { containers: [], byContainer: {} };
const expandedState = {};

function showBanner(type, msg){
  banner.className = "banner " + (type || "ok");
  banner.textContent = msg;
  banner.style.display = "block";
  setTimeout(() => banner.style.display = "none", 4500);
}

confirmCancel.onclick = () => {
  confirmOverlay.style.display = "none";
  if (confirmResolve) confirmResolve(false);
};
confirmProceed.onclick = () => {
  confirmOverlay.style.display = "none";
  if (confirmResolve) confirmResolve(true);
};
function askConfirm(title, msg){
  confirmTitle.textContent = title;
  confirmMessage.textContent = msg;
  confirmOverlay.style.display = "flex";
  return new Promise(r => confirmResolve = r);
}
function esc(s){
  return String(s || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
async function requireAuth(){
  await APP_NAV.render("navBar");
  const { data } = await sb.auth.getUser();
  if (!data?.user){ window.location.href = "index.html"; return null; }
  return data.user;
}
async function signedThumb(path){
  if (!path) return null;
  const { data, error } = await sb.storage.from("item-photos").createSignedUrl(path, 1800);
  if (error) return null;
  return data?.signedUrl || null;
}
async function loadData(){
  const [{ data: containers, error: cErr }, { data: items, error: iErr }] = await Promise.all([
    sb.from("containers").select("*").eq("is_active", true).order("container_code"),
    sb.from("items").select("*").eq("is_active", true).order("created_at", { ascending: false })
  ]);
  if (cErr) throw cErr;
  if (iErr) throw iErr;
  const byContainer = {};
  (items || []).forEach(i => {
    if (!byContainer[i.container_code]) byContainer[i.container_code] = [];
    byContainer[i.container_code].push(i);
  });
  state = { containers: containers || [], byContainer };
}
function toggleContainer(code){
  expandedState[code] = !expandedState[code];
  const content = document.querySelector('[data-content="' + code + '"]');
  const btn = document.querySelector('[data-toggle="' + code + '"]');
  if (!content || !btn) return;
  const isOpen = !!expandedState[code];
  content.classList.toggle("hidden", !isOpen);
  btn.textContent = isOpen ? "−" : "+";
}
function setAllContainers(expanded){
  state.containers.forEach(c => { expandedState[c.container_code] = expanded; });
  document.querySelectorAll("[data-content]").forEach(el => {
    el.classList.toggle("hidden", !expanded);
  });
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.textContent = expanded ? "−" : "+";
  });
}
function matchesFilter(containerCode, itemDescription, q){
  const s = q.trim().toLowerCase();
  if (!s) return true;
  return String(containerCode || "").toLowerCase().includes(s) || String(itemDescription || "").toLowerCase().includes(s);
}
function updateSummaryFromDOM(){
  const containers = reportRoot.querySelectorAll(".container-group").length;
  let items = 0;
  reportRoot.querySelectorAll("tbody tr[data-item-id]").forEach(tr => {
    if (tr.dataset.deleted !== "1") items += 1;
  });
  summary.textContent = containers + " container(s), " + items + " item(s).";
}
function updateContainerMeta(containerCode){
  const group = reportRoot.querySelector('.container-group[data-container-code="' + containerCode + '"]');
  if (!group) return;
  const visibleItems = group.querySelectorAll('tbody tr[data-item-id]:not([data-deleted="1"])').length;
  const meta = group.querySelector(".container-meta");
  if (meta) meta.textContent = visibleItems + " active item(s)";
  const tbody = group.querySelector("tbody");
  const content = group.querySelector('[data-content="' + containerCode + '"]');
  if (tbody && visibleItems === 0 && content){
    const existingRows = tbody.querySelectorAll('tr[data-item-id]');
    existingRows.forEach(r => r.remove());
    if (!content.querySelector(".empty-note")){
      const empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "No matching active items in this container.";
      content.appendChild(empty);
    }
  }
}
async function deleteItemInPlace(item, rowEl){
  const ok = await askConfirm("Delete item?", (item.item_description || "(no description)") + " from " + item.container_code);
  if (!ok) return;
  rowEl.classList.add("row-deleting");
  rowEl.dataset.deleted = "1";
  const { error } = await sb.from("items").update({ is_active: false }).eq("item_id", item.item_id);
  if (error){
    rowEl.classList.remove("row-deleting");
    rowEl.dataset.deleted = "0";
    throw error;
  }
  updateContainerMeta(item.container_code);
  updateSummaryFromDOM();
  showBanner("ok", "Item deleted.");
  setTimeout(() => {
    rowEl.remove();
    updateContainerMeta(item.container_code);
    updateSummaryFromDOM();
  }, 900);
}
async function deleteContainerCascade(container, groupEl){
  const items = state.byContainer[container.container_code] || [];
  const count = items.filter(i => i.is_active !== false).length;
  const msg = count
    ? `Delete container ${container.container_code} and all ${count} item(s) inside it?`
    : `Delete empty container ${container.container_code}?`;
  const ok = await askConfirm("Delete container?", msg);
  if (!ok) return;

  groupEl.style.opacity = ".6";
  const ops = [
    sb.from("containers").update({ is_active: false }).eq("container_id", container.container_id)
  ];
  if (count){
    ops.push(
      sb.from("items").update({ is_active: false }).eq("container_code", container.container_code).eq("is_active", true)
    );
  }
  const results = await Promise.all(ops);
  const err = results.find(r => r.error)?.error;
  if (err){
    groupEl.style.opacity = "1";
    throw err;
  }

  state.containers = state.containers.filter(c => c.container_code !== container.container_code);
  delete state.byContainer[container.container_code];
  showBanner("ok", count ? `Container and ${count} item(s) deleted.` : "Container deleted.");
  setTimeout(() => {
    groupEl.remove();
    updateSummaryFromDOM();
  }, 250);
}
async function render(){
  await loadData();
  const q = qEl.value.trim().toLowerCase();
  const thumbMode = thumbModeEl.value;
  const sortBy = sortByEl.value;
  let containers = [...state.containers];

  containers = containers.filter(container => {
    const items = state.byContainer[container.container_code] || [];
    if (matchesFilter(container.container_code, "", q)) return true;
    return items.some(item => matchesFilter(item.container_code, item.item_description, q));
  });

  if (sortBy === "recent"){
    containers.sort((a, b) => {
      const aItems = state.byContainer[a.container_code] || [];
      const bItems = state.byContainer[b.container_code] || [];
      const aRecent = aItems[0]?.created_at || "";
      const bRecent = bItems[0]?.created_at || "";
      return String(bRecent).localeCompare(String(aRecent));
    });
  }

  reportRoot.innerHTML = "";
  let itemCount = 0;

  for (const container of containers){
    const allItems = state.byContainer[container.container_code] || [];
    const items = allItems.filter(item => matchesFilter(item.container_code, item.item_description, q));
    itemCount += items.length;
    if (!(container.container_code in expandedState)) expandedState[container.container_code] = false;

    const group = document.createElement("div");
    group.className = "container-group";
    group.dataset.containerCode = container.container_code;

    const head = document.createElement("div");
    head.className = "container-head";
    head.innerHTML = `
      <div class="container-head-left">
        <button class="collapse-btn no-print" data-toggle="${esc(container.container_code)}">${expandedState[container.container_code] ? "−" : "+"}</button>
        <div>
          <div class="container-title">${esc(container.container_code)}</div>
          <div class="container-meta">${items.length} active item(s)</div>
        </div>
      </div>
      <div class="action-stack no-print">
        <a class="icon-circle icon-edit" href="container_detail.html?container_code=${encodeURIComponent(container.container_code)}" title="Edit container">✎</a>
        <button class="icon-circle icon-delete" data-del-container="${esc(container.container_code)}" title="Delete container">✕</button>
      </div>
    `;
    group.appendChild(head);

    const content = document.createElement("div");
    content.className = expandedState[container.container_code] ? "" : "hidden";
    content.setAttribute("data-content", container.container_code);

    if (items.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "No matching active items in this container.";
      content.appendChild(empty);
    } else {
      const table = document.createElement("table");
      table.className = "report-table";
      table.innerHTML = `
        <thead>
          <tr>
            <th>${thumbMode === "thumb" ? "Photo" : ""}</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Created</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector("tbody");

      for (const item of items){
        const tr = document.createElement("tr");
        tr.dataset.itemId = item.item_id;
        tr.dataset.deleted = "0";
        const thumb = thumbMode === "thumb" ? await signedThumb(item.photo_path) : null;
        tr.innerHTML = `
          <td>${thumbMode === "thumb" ? (thumb ? `<img class="thumb" src="${thumb}">` : "") : ""}</td>
          <td class="item-desc">${esc(item.item_description || "(no description)")}</td>
          <td>${esc(item.quantity || "")}</td>
          <td>${item.created_at ? new Date(item.created_at).toLocaleString() : ""}</td>
          <td class="no-print">
            <div class="item-action-stack">
              <a class="icon-item" href="item_detail.html?ref_uid=${encodeURIComponent(item.ref_uid)}" title="Edit item">✎</a>
              <button class="icon-item icon-item-delete" data-del-item="${esc(item.item_id)}" title="Delete item">✕</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);

        tr.querySelector('[data-del-item="' + item.item_id + '"]').addEventListener("click", () => {
          deleteItemInPlace(item, tr).catch(err => {
            tr.classList.remove("row-deleting");
            tr.dataset.deleted = "0";
            showBanner("err", "Delete failed: " + (err.message || err));
          });
        });
      }
      content.appendChild(table);
    }

    group.appendChild(content);
    reportRoot.appendChild(group);

    head.querySelector('[data-toggle="' + container.container_code + '"]').addEventListener("click", () => {
      toggleContainer(container.container_code);
    });
    head.querySelector('[data-del-container="' + container.container_code + '"]').addEventListener("click", () => {
      deleteContainerCascade(container, group).catch(err => {
        group.style.opacity = "1";
        showBanner("err", "Delete failed: " + (err.message || err));
      });
    });
  }

  summary.textContent = containers.length + " container(s), " + itemCount + " item(s).";
}
qEl.addEventListener("input", () => render().catch(err => showBanner("err", err.message || err)));
sortByEl.addEventListener("change", () => render().catch(err => showBanner("err", err.message || err)));
thumbModeEl.addEventListener("change", () => render().catch(err => showBanner("err", err.message || err)));
btnExpandAll.addEventListener("click", () => setAllContainers(true));
btnCollapseAll.addEventListener("click", () => setAllContainers(false));
btnRefresh.addEventListener("click", () => render().catch(err => showBanner("err", err.message || err)));
btnPrint.addEventListener("click", () => window.print());

requireAuth().then(user => { if (user) render().catch(err => showBanner("err", err.message || err)); });
</script>
</body>
</html>
