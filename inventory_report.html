<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Report</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="navigation.js"></script>
  <style>
    body{background:#eef2f7;color:#17212b}
    .report-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
    .report-toolbar .spacer{flex:1}
    .report-table th,.report-table td{vertical-align:middle}
    .report-table th{white-space:nowrap}
    .thumb-sm{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc}
    .icon-btn{border:1px solid #94a3b8;background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1;color:#17212b}
    .icon-btn:hover{background:#eef3f8}
    .icon-row{display:flex;gap:6px;align-items:center}
    .container-group{border:1px solid #cbd5e1;border-radius:12px;margin:16px 0;overflow:hidden;background:#fff}
    .container-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#eaf1f8;border-bottom:1px solid #cbd5e1;padding:12px 14px}
    .container-title{font-weight:800;font-size:20px;color:#0f172a}
    .container-meta{color:#334155;font-size:13px;margin-top:4px;font-weight:600}
    .empty-note{color:#334155;padding:14px}
    .danger-lite{color:#8a1320;border-color:#e2a8af}
    .print-only{display:none}
    .table th{background:#f3f6fa;color:#0f172a;font-weight:800}
    .table td{color:#17212b;background:#fff}
    .item-desc{color:#111827;font-weight:600}
    .small-note,#summary{color:#334155;font-weight:600}
    .confirm-overlay{
      position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:9999;
    }
    .confirm-box{
      background:#fff; border-radius:14px; width:min(520px,92vw); padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.18);
      border:1px solid #cbd5e1;
    }
    .confirm-box h3{margin:0 0 10px 0; color:#0f172a}
    .confirm-box p{color:#334155; margin:0 0 16px 0}
    .confirm-actions{display:flex; gap:10px; justify-content:flex-end}
    .btn-lite{
      padding:10px 14px; border:1px solid #94a3b8; border-radius:8px; background:#f8fafc; color:#17212b; cursor:pointer;
    }
    .btn-danger{
      padding:10px 14px; border:1px solid #dc2626; border-radius:8px; background:#fee2e2; color:#7f1d1d; cursor:pointer;
    }
    @media print{
      .no-print,#navBar,.banner,.confirm-overlay{display:none !important}
      .print-only{display:block}
      body{background:#fff;padding:0}
      .page{max-width:none}
      .card{box-shadow:none;border:none;padding:0}
      .container-group{break-inside:avoid}
      a{color:#000;text-decoration:none}
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="navBar" class="no-print"></div>
    <div id="banner" class="banner" style="display:none;"></div>

    <div class="card">
.card h1 {
  color: #ffffff;
  font-weight: 700;
  letter-spacing: 0.3px;
}
      <div class="small-note print-only" id="printStamp"></div>

      <div class="report-toolbar no-print">
        <div style="min-width:260px; flex:1;">
          <label>Filter</label>
          <input id="q" type="text" placeholder="container code or item description" />
        </div>
        <div>
          <label>Sort Containers</label>
          <select id="sortBy">
            <option value="code">Container Code</option>
            <option value="recent">Most Recently Added Item</option>
          </select>
        </div>
        <div>
          <label>Show</label>
          <select id="thumbMode">
            <option value="thumb">Thumbnails</option>
            <option value="none">No Thumbnails</option>
          </select>
        </div>
        <div class="spacer"></div>
        <button class="btn secondary" id="btnRefresh" style="max-width:140px;">Refresh</button>
        <button class="btn secondary" id="btnPrint" style="max-width:140px;">Print</button>
      </div>

      <div class="small-note" id="summary"></div>
      <div id="reportRoot"></div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button class="btn-lite" id="confirmCancel">Cancel</button>
        <button class="btn-danger" id="confirmProceed">Delete</button>
      </div>
    </div>
  </div>

<script>
(async function(){
  const banner = document.getElementById("banner");
  const reportRoot = document.getElementById("reportRoot");
  const qEl = document.getElementById("q");
  const sortByEl = document.getElementById("sortBy");
  const thumbModeEl = document.getElementById("thumbMode");
  const btnRefresh = document.getElementById("btnRefresh");
  const btnPrint = document.getElementById("btnPrint");
  const summary = document.getElementById("summary");
  const printStamp = document.getElementById("printStamp");
  const confirmOverlay = document.getElementById("confirmOverlay");
  const confirmTitle = document.getElementById("confirmTitle");
  const confirmMessage = document.getElementById("confirmMessage");
  const confirmCancel = document.getElementById("confirmCancel");
  const confirmProceed = document.getElementById("confirmProceed");

  function showBanner(type, msg){
    banner.className = "banner " + (type || "ok");
    banner.textContent = msg;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 5000);
  }
  function esc(s){
    return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  }
  function askConfirm(title, message){
    return new Promise(resolve => {
      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      confirmOverlay.style.display = "flex";
      function cleanup(val){
        confirmOverlay.style.display = "none";
        confirmCancel.onclick = null;
        confirmProceed.onclick = null;
        resolve(val);
      }
      confirmCancel.onclick = () => cleanup(false);
      confirmProceed.onclick = () => cleanup(true);
    });
  }

  async function requireAuth(){
    await window.APP_NAV.render("navBar");
    const sb = getSupabase();
    const { data } = await sb.auth.getUser();
    if (!data.user){ window.location.href = "index.html"; return null; }
    return data.user;
  }
  async function signedThumb(path){
    if (!path) return null;
    const sb = getSupabase();
    const { data, error } = await sb.storage.from("item-photos").createSignedUrl(path, 60 * 30);
    if (error) return null;
    return data?.signedUrl || null;
  }

  const user = await requireAuth();
  if (!user) return;

  let state = { containers: [], itemsByContainer: new Map() };

  function itemMatchesFilter(item, q){
    if (!q) return true;
    const s = q.toLowerCase();
    return (item.container_code || "").toLowerCase().includes(s) || (item.item_description || "").toLowerCase().includes(s);
  }
  function containerMatchesFilter(container, items, q){
    if (!q) return true;
    const s = q.toLowerCase();
    if ((container.container_code || "").toLowerCase().includes(s)) return true;
    return items.some(it => itemMatchesFilter(it, q));
  }

  async function loadData(){
    summary.textContent = "Loading report…";
    reportRoot.innerHTML = "";
    const sb = getSupabase();
    const [{ data: containers, error: cErr }, { data: items, error: iErr }] = await Promise.all([
      sb.from("containers").select("container_id, ref_uid, container_code, container_description, created_at, created_by, updated_at, updated_by, is_active")
        .eq("is_active", true).order("container_code", { ascending: true }),
      sb.from("items").select("item_id, ref_uid, container_code, item_description, quantity, photo_path, created_at, created_by, updated_at, updated_by, is_active")
        .eq("is_active", true).order("container_code", { ascending: true }).order("created_at", { ascending: false })
    ]);
    if (cErr) throw cErr;
    if (iErr) throw iErr;

    const byContainer = new Map();
    for (const it of items || []){
      const code = it.container_code || "";
      if (!byContainer.has(code)) byContainer.set(code, []);
      byContainer.get(code).push(it);
    }
    state.containers = containers || [];
    state.itemsByContainer = byContainer;
  }

  async function deleteItem(item){
    const ok = await askConfirm("Delete item?", `${item.item_description || "(no description)"} from ${item.container_code}`);
    if (!ok) return;
    const sb = getSupabase();
    const payload = { is_active: false };
    if ("updated_at" in item) payload.updated_at = new Date().toISOString();
    if ("updated_by" in item) payload.updated_by = user.id;
    const { error } = await sb.from("items").update(payload).eq("item_id", item.item_id);
    if (error) throw error;
    showBanner("ok", "Item deleted.");
    await refresh();
  }

  async function deleteContainer(container, items){
    if (items.length){
      showBanner("warn", `Container ${container.container_code} still has ${items.length} active item(s). Delete items first.`);
      return;
    }
    const ok = await askConfirm("Delete container?", `Delete empty container ${container.container_code}?`);
    if (!ok) return;
    const sb = getSupabase();
    const payload = { is_active: false };
    if ("updated_at" in container) payload.updated_at = new Date().toISOString();
    if ("updated_by" in container) payload.updated_by = user.id;
    const { error } = await sb.from("containers").update(payload).eq("container_id", container.container_id);
    if (error) throw error;
    showBanner("ok", "Container deleted.");
    await refresh();
  }

  async function render(){
    const q = qEl.value.trim();
    const thumbMode = thumbModeEl.value;
    const sortBy = sortByEl.value;
    let containers = state.containers.slice();

    containers = containers.filter(c => {
      const items = state.itemsByContainer.get(c.container_code) || [];
      return containerMatchesFilter(c, items, q);
    });

    if (sortBy === "recent"){
      containers.sort((a, b) => {
        const ai = state.itemsByContainer.get(a.container_code) || [];
        const bi = state.itemsByContainer.get(b.container_code) || [];
        const ad = ai[0]?.created_at || a.created_at || "";
        const bd = bi[0]?.created_at || b.created_at || "";
        return String(bd).localeCompare(String(ad));
      });
    } else {
      containers.sort((a, b) => String(a.container_code || "").localeCompare(String(b.container_code || "")));
    }

    const itemCount = containers.reduce((n, c) => {
      const items = state.itemsByContainer.get(c.container_code) || [];
      return n + items.filter(it => itemMatchesFilter(it, q)).length;
    }, 0);

    summary.textContent = `${containers.length} container(s), ${itemCount} item(s).`;
    printStamp.textContent = `Printed ${new Date().toLocaleString()}`;
    reportRoot.innerHTML = "";

    if (!containers.length){
      reportRoot.innerHTML = `<div class="empty-note">No containers match the current filter.</div>`;
      return;
    }

    for (const container of containers){
      const allItems = state.itemsByContainer.get(container.container_code) || [];
      const items = allItems.filter(it => itemMatchesFilter(it, q));

      const group = document.createElement("div");
      group.className = "container-group";

      const head = document.createElement("div");
      head.className = "container-head";
      head.innerHTML = `
        <div>
          <div class="container-title mono">${esc(container.container_code)}</div>
          <div class="container-meta">
            ${esc(container.container_description || "")}
            ${container.container_description ? " • " : ""}
            ${items.length} active item(s)
          </div>
        </div>
        <div class="icon-row no-print">
          <a class="icon-btn" title="Container Detail" href="container_detail.html?container_code=${encodeURIComponent(container.container_code)}">📦</a>
          <button class="icon-btn danger-lite" title="Delete Container" data-kind="delete-container">🗑</button>
        </div>
      `;
      group.appendChild(head);

      if (!items.length){
        const empty = document.createElement("div");
        empty.className = "empty-note";
        empty.textContent = "No matching active items in this container.";
        group.appendChild(empty);
      } else {
        const table = document.createElement("table");
        table.className = "table report-table";
        table.innerHTML = `
          <thead>
            <tr>
              <th>${thumbMode === "thumb" ? "Photo" : ""}</th>
              <th>Description</th>
              <th>Qty</th>
              <th>Created</th>
              <th class="no-print">Links</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");

        for (const item of items){
          const tr = document.createElement("tr");
          const thumbUrl = thumbMode === "thumb" ? await signedThumb(item.photo_path) : null;
          tr.innerHTML = `
            <td>${thumbMode === "thumb" ? (thumbUrl ? `<img class="thumb-sm" src="${thumbUrl}" />` : "") : ""}</td>
            <td class="item-desc">${esc(item.item_description || "(no description)")}</td>
            <td class="mono">${esc(item.quantity ?? "")}</td>
            <td class="mono">${esc(item.created_at ? new Date(item.created_at).toLocaleString() : "")}</td>
            <td class="no-print">
              <div class="icon-row">
                <a class="icon-btn" title="Item Detail" href="item_detail.html?ref_uid=${encodeURIComponent(item.ref_uid)}">🔎</a>
                <button class="icon-btn danger-lite" title="Delete Item" data-kind="delete-item">🗑</button>
              </div>
            </td>
          `;
          tr.querySelector('[data-kind="delete-item"]').addEventListener("click", () => {
            deleteItem(item).catch(e => showBanner("err", "Delete failed: " + (e.message || e)));
          });
          tbody.appendChild(tr);
        }
        group.appendChild(table);
      }

      head.querySelector('[data-kind="delete-container"]').addEventListener("click", () => {
        deleteContainer(container, allItems).catch(e => showBanner("err", "Delete failed: " + (e.message || e)));
      });

      reportRoot.appendChild(group);
    }
  }

  async function refresh(){
    try { await loadData(); await render(); }
    catch(e){ showBanner("err", "Load failed: " + (e.message || e)); summary.textContent = ""; }
  }

  qEl.addEventListener("input", () => { render().catch(console.error); });
  sortByEl.addEventListener("change", () => { render().catch(console.error); });
  thumbModeEl.addEventListener("change", () => { render().catch(console.error); });
  btnRefresh.addEventListener("click", refresh);
  btnPrint.addEventListener("click", () => window.print());

  await refresh();
})();
</script>
</body>
</html>
